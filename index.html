let binds = defaultBinds();

function saveBinds() {
  try { localStorage.setItem("rott-binds", JSON.stringify(binds)); } catch (err) {}

function loadBinds() {
  binds = defaultBinds();
  try {
    const raw = JSON.parse(localStorage.getItem("rott-binds") || "null");
    if (!raw || typeof raw !== "object") return;
    for (const key of Object.keys(binds)) {
      if (!Array.isArray(raw[key])) continue;
      const codes = raw[key].filter((c) => typeof c === "string" && c && c !== "Escape");
      const keep = MOVE_ARROW[key];
      if (keep && codes.indexOf(keep) < 0) codes.push(keep);
      if (codes.length) binds[key] = codes;
    }
    binds.fire = keepFireKeys(binds.fire);
  } catch (err) {}
}

const FIRE_CODES = ["ControlLeft", "ControlRight", "Enter", "NumpadEnter"];

function keepFireKeys(list) {
  const out = Array.isArray(list) ? list.slice() : [];
  for (let i = 0; i < FIRE_CODES.length; i++) {
    if (out.indexOf(FIRE_CODES[i]) < 0) out.push(FIRE_CODES[i]);
  }
  return out;
}

function actionHeld(action) {
  if (action === "fire") {
    if (held.ControlLeft || held.ControlRight || held.Enter || held.NumpadEnter) return true;
  }
  const codes = binds[action];
  if (!codes) return false;
  for (let i = 0; i < codes.length; i++) if (held[codes[i]]) return true;
  if (MOVE_ARROW[action] && held[MOVE_ARROW[action]]) return true;
  return false;
}

function codeIs(action, code) {
  if (action === "fire" && FIRE_CODES.indexOf(code) >= 0) return true;
  const codes = binds[action];
  return !!(codes && codes.indexOf(code) >= 0);
}

function isFireEvent(e) {
  if (!e) return false;
  const key = (e.key || "").toLowerCase();
  const code = e.code || "";
  if (key === "control" || key === "enter") return true;
  if (code.indexOf("Control") === 0 || code === "Enter" || code === "NumpadEnter") return true;
  return codeIs("fire", code);
}

function fireHeld() {

function hash(x, y) {
  let n = (x * 374761393 + y * 668265263) | 0;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967296;
}

function texNoise(size, fn) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = (y * size + x) * 4;
    const col = fn(x, y, size);
    img.data[i] = col[0] | 0;
    img.data[i + 1] = col[1] | 0;
    img.data[i + 2] = col[2] | 0;
    img.data[i + 3] = col[3] == null ? 255 : col[3];
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.colorSpace = THREE.NoColorSpace;
  return t;
}

function makeTextures() {
  stoneTex = texNoise(64, (x, y) => {
    const row = y >> 3;
    const shift = (row & 1) ? 8 : 0;
    const bx = (x + shift) & 15;
    const by = y & 7;
    const mortar = bx === 0 || by === 0 || bx === 15;
    const n = (hash(x, y) * 28) | 0;
    const stain = hash(x >> 2, y >> 2) > 0.82 ? 18 : 0;
    if (mortar) return [62 + n * 0.25, 36 + n * 0.15, 22];
    const dado = y > 42;
    const base = dado ? 168 : 220;
    return [base + n - stain, (base * 0.52 + n * 0.25) | 0, (base * 0.28) | 0];
  });
  blockTex = texNoise(64, (x, y) => {
    const bx = x & 15, by = y & 15;
    const mortar = bx < 2 || by < 2;
    const n = (hash(x, y) * 22) | 0;
    if (mortar) return [48, 28, 16];
    return [168 + n, 88 + n * 0.35, 42 + n * 0.15];
  });
  darkTex = texNoise(64, (x, y) => {
    const row = y >> 4;
    const shift = (row & 1) ? 8 : 0;
    const bx = (x + shift) & 15, by = y & 15;
    const mortar = bx < 2 || by < 2;
    const n = (hash(x, y) * 18) | 0;
    if (mortar) return [22, 16, 12];
    return [58 + n, 40 + n * 0.4, 28];
  });
  floorTex = texNoise(64, (x, y) => {
    const t = (x >> 4) ^ (y >> 4);
    const n = (hash(x, y) * 16) | 0;
    const edge = (x & 15) < 1 || (y & 15) < 1;
    const b = t ? 62 : 52;
    if (edge) return [36, 26, 18];
    return [b + n, 40 + n * 0.4, 26];
  });
  dirtTex = texNoise(64, (x, y) => {
    const tile = (x >> 4) ^ (y >> 4);
    const n = (hash(x, y) * 22) | 0;
    const edge = (x & 15) < 1 || (y & 15) < 1;
    if (edge) return [72, 42, 18];
    const b = tile ? 246 : 214;
    return [b + n, 176 + n * 0.35, 78];
  });
  metalTex = texNoise(64, (x, y) => {
    const n = (hash(x, y) * 14) | 0;
    const rivet = (x % 16 < 2 && y % 16 < 2) ? 36 : 0;
    return [48 + n + rivet, 42 + n, 36 + n];
  });
  padTex = texNoise(64, (x, y) => {
    const dx = x - 32, dy = y - 32;
    const r = Math.sqrt(dx * dx + dy * dy);
    const ring = Math.floor(r / 5);
    const groove = Math.abs(r % 5) < 1.1;
    const n = (hash(x, y) * 18) | 0;
    if (r > 30) return [28, 20, 12];
    if (groove) return [48, 32, 14];
    if (ring === 0) return [210 + n, 150 + n * 0.4, 48];
    if (ring === 1) return [168, 108, 36];
    if (ring === 2) return [140 + n, 88, 28];
    if (ring === 3) return [118, 72, 22];
    return [86, 54, 18];
  });
  gadTex = texNoise(64, (x, y) => {
    const dx = x - 32, dy = y - 32;
    const r = Math.sqrt(dx * dx + dy * dy);
    const n = (hash(x, y) * 12) | 0;
    if (r > 30) return [36, 26, 14];
    if (r > 26) return [92, 62, 22];
    if (Math.abs(r - 16) < 1.2 || Math.abs(r - 8) < 1) return [70, 46, 16];
    return [150 + n, 102 + n * 0.3, 36];
  });
  bannerTex = texNoise(64, (x, y) => {
    const tri = Math.abs(x - 32) < (y * 0.42) && y > 14 && y < 54;
    const n = (hash(x, y) * 10) | 0;
    return tri ? [18, 10, 8] : [132 + n, 16, 14];
  });
  crateTex = texNoise(64, (x, y) => {
    const n = (hash(x, y) * 16) | 0;
    const edge = x < 3 || y < 3 || x > 60 || y > 60 || Math.abs(x - 32) < 2;
    return [108 + n - (edge ? 24 : 0), 74 + n * 0.4, 32];
  });
  bloodTex = texNoise(32, (x, y) => {
    const dx = x - 16, dy = y - 16;
    const r = Math.sqrt(dx * dx + dy * dy) + hash(x, y) * 4;
    const a = r < 15 ? 220 : 0;
    return [92 + ((x * y) & 18), 6, 6, a];
  });
  flashTex = texNoise(32, (x, y) => {
    const dx = x - 16, dy = y - 16;
    const r = Math.sqrt(dx * dx + dy * dy);
    if (r < 4) return [255, 255, 210];
    if (r < 9) return [255, 180, 40];
    if (r < 14) return [220, 80, 10, 180];
    return [0, 0, 0, 0];
  });
  skyTex = texNoise(64, (x, y) => {
    const t = y / 64;
    const n = (hash(x >> 1, y >> 1) * 18) | 0;
    const cloud = hash(x >> 2, (y >> 2) + 3) > 0.64 ? 28 : 0;
    const hz = Math.exp(-Math.pow((t - 0.62) * 3.6, 2));
    return [
      210 + t * 40 + hz * 45 + n + cloud,
      140 + t * 28 + hz * 30 + cloud,
      78 + t * 18 + hz * 8
    ];
  });
}

function env(type, freq, Q) {
  const f = ac.createBiquadFilter();
  f.type = type;
  f.frequency.value = freq;
  if (Q) f.Q.value = Q;
  return f;
}

function bangBuf(dur) {
  const n = ac.createBuffer(1, Math.max(1, (ac.sampleRate * dur) | 0), ac.sampleRate);
  const d = n.getChannelData(0);
  let brown = 0;
  const click = (ac.sampleRate * 0.003) | 0;
  for (let i = 0; i < d.length; i++) {
    const white = Math.random() * 2 - 1;
    brown = brown * 0.97 + white * 0.03;
    d[i] = (white * 0.52 + brown * 0.48) * (i < click ? 1.85 : 1);
  }
  return n;
}

function gunDest() {
  if (!ac) return null;
  if (gunIn) return gunIn;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 6;
  comp.ratio.value = 5;
  comp.attack.value = 0.001;
  comp.release.value = 0.14;
  const shaper = ac.createWaveShaper();
  const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const x = i / 128 - 1;
    curve[i] = Math.tanh(x * 2.4);
  }
  shaper.curve = curve;
  shaper.oversample = "2x";
  const make = ac.createGain();
  make.gain.value = 3.1;
  comp.connect(shaper);
  shaper.connect(make);
  make.connect(ac.destination);
  gunIn = comp;
  return gunIn;
}

function outNode(dest) {
  return dest || ac.destination;
}

function footDest() {
  if (!ac) initAudio();
  if (!ac) return null;
  if (footIn) return footIn;
  const g = ac.createGain();
  g.gain.value = 2.8;
  g.connect(ac.destination);
  footIn = g;
  return g;
}

function blast(dur, vol, freq, type, Q, dest) {
  initAudio();
  if (!ac) return;
  const s = ac.createBufferSource();
  s.buffer = bangBuf(dur);
  const f = env(type || "lowpass", freq || 1200, Q || 0.85);
  const g = ac.createGain();
  const t = ac.currentTime;
  g.gain.setValueAtTime(Math.max(0.001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(outNode(dest));
  s.start();
}

function kick(freq, dur, vol, dest) {
  initAudio();
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(16, freq * 0.22), t + dur);
  g.gain.setValueAtTime(Math.max(0.001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(outNode(dest));
  o.start(t); o.stop(t + dur + 0.02);
}

function whoosh(dur, vol, startF, endF) {
  if (!ac) return;
  const t = ac.currentTime;
  const s = ac.createBufferSource();
  s.buffer = bangBuf(dur);
  const f = env("bandpass", startF, 1.15);
  f.frequency.setValueAtTime(startF, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(40, endF), t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(Math.max(0.001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(gunDest() || ac.destination);
  s.start();
}

function playNoise(dur, vol, freq, type) {
  blast(dur, vol, freq, type || "lowpass", type === "bandpass" ? 1.4 : 0.85);
}

function playOsc(freq, dur, type, vol, slide) {
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(16, slide), t + dur);
  g.gain.setValueAtTime(Math.max(0.001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function thump(freq, dur, vol) {

}

function crack(vol) {
  blast(0.018, vol, 2800, "highpass", 0.7);
  blast(0.08, vol * 0.85, 1400, "bandpass", 1.1);
}

function loopNoiseBuf(dur, mode) {
  const n = ac.createBuffer(1, Math.max(1, (ac.sampleRate * dur) | 0), ac.sampleRate);
  const d = n.getChannelData(0);
  let brown = 0, pink = 0;
  for (let i = 0; i < d.length; i++) {
    const white = Math.random() * 2 - 1;
    brown = brown * 0.985 + white * 0.015;
    pink = pink * 0.87 + white * 0.13;
    d[i] = mode === "brown" ? brown * 3.4 : mode === "pink" ? pink * 1.55 : white * 0.65;
  }
  return n;
}

function stopAmbience() {
  for (const n of amb.nodes) {
    try { if (n.stop) n.stop(); } catch (err) {}
    try { if (n.disconnect) n.disconnect(); } catch (err) {}
  }
  amb.nodes = [];
  amb.master = amb.windG = amb.airG = amb.torchG = amb.clothG = amb.droneG = amb.rushG = null;
}

function startAmbience() {
  stopAmbience();
  initAudio();
  if (!ac) return;
  try { if (ac.state === "suspended") ac.resume(); } catch (err) {}
  try {
    const master = ac.createGain();
    master.gain.value = 1.05;
    master.connect(ac.destination);
    amb.master = master;

    function layer(buf, type, freq, Q, gain) {
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const f = env(type, freq, Q);
      const g = ac.createGain();
      g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(master);
      src.start();
      amb.nodes.push(src, f, g);
      return g;
    }

    const brown = loopNoiseBuf(5.2, "brown");
    const pink = loopNoiseBuf(4.4, "pink");
    amb.windG = layer(brown, "lowpass", 240, 0.7, 0.2);
    amb.airG = layer(pink, "bandpass", 1100, 0.75, 0.1);
    amb.torchG = layer(pink, "bandpass", 1700, 1.35, 0.08);
    amb.clothG = layer(pink, "bandpass", 480, 0.9, 0.05);
    amb.rushG = layer(pink, "highpass", 900, 0.7, 0.001);

    const droneG = ac.createGain();
    droneG.gain.value = 0.05;
    droneG.connect(master);
    amb.droneG = droneG;
    const d1 = ac.createOscillator();
    d1.type = "sine";
    d1.frequency.value = 43;
    const d2 = ac.createOscillator();
    d2.type = "sine";
    d2.frequency.value = 64.4;
    const d3 = ac.createOscillator();
    d3.type = "triangle";
    d3.frequency.value = 86;
    const d3g = ac.createGain();
    d3g.gain.value = 0.35;
    d1.connect(droneG);
    d2.connect(droneG);
    d3.connect(d3g); d3g.connect(droneG);
    d1.start(); d2.start(); d3.start();
    amb.nodes.push(d1, d2, d3, d3g, droneG, master);

    amb.dripT = 0.6;
    amb.crackleT = 0.25;
  } catch (err) {}
}

function playerCell() {
  return {
    c: Math.round(player.x / TILE + W / 2),
    r: Math.round(player.z / TILE + 2)
  };
}

function floorKind() {
  if (!player) return "stone";
  const pos = playerCell();
  const ch = cell(pos.c, pos.r);
  if (ch === "c") return "metal";
  if (pos.r <= 7 && ch !== ".") return "dirt";
  return "stone";
}

function updateAmbience(dt, moving, running, airborne) {
  if (!started) return;
  if (!ac) initAudio();
  if (!ac) return;
  if (!amb.master) startAmbience();
  if (!amb.master) return;
  const t = ac.currentTime;
  const yard = playerCell().r <= 7;
  if (amb.windG) amb.windG.gain.setTargetAtTime(yard ? 0.34 : 0.08, t, 0.3);
  if (amb.airG) amb.airG.gain.setTargetAtTime(yard ? 0.18 : 0.05, t, 0.3);
  if (amb.torchG) amb.torchG.gain.setTargetAtTime((yard ? 0.1 : 0.16) * (0.7 + Math.random() * 0.5), t, 0.07);
  if (amb.clothG) amb.clothG.gain.setTargetAtTime(airborne ? 0.06 : (moving ? (running ? 0.2 : 0.14) : 0.045), t, 0.1);
  if (amb.rushG) amb.rushG.gain.setTargetAtTime(airborne ? 0.18 : 0.001, t, 0.08);
  if (amb.droneG) amb.droneG.gain.setTargetAtTime(yard ? 0.04 : 0.06, t, 0.4);
  amb.dripT -= dt;
  if (amb.dripT <= 0) {
    amb.dripT = yard ? 1.4 + Math.random() * 1.8 : 0.7 + Math.random() * 1.2;
    SFX.drip();
  }
  amb.crackleT -= dt;
  if (amb.crackleT <= 0) {
    amb.crackleT = 0.18 + Math.random() * 0.45;
    if (!yard || Math.random() < 0.3) SFX.crackle();
  }
}

function paintHitCue(g) {
  if (hitCueT <= 0) return;
  const a = Math.min(1, hitCueT * 2.2);
  const cx = 160, cy = 84;
  const ox = Math.sin(hitCueAng) * 38;
  const oy = -Math.cos(hitCueAng) * 32;
  g.save();
  g.translate(cx + ox, cy + oy);
  g.rotate(hitCueAng);
  g.fillStyle = "rgba(210,16,16," + (0.3 + a * 0.6) + ")";
  g.beginPath();
  g.moveTo(0, -13);
  g.lineTo(11, 9);
  g.lineTo(0, 3);
  g.lineTo(-11, 9);
  g.closePath();
  g.fill();
  g.restore();
  const side = Math.sin(hitCueAng);
  if (side > 0.2) {
    g.fillStyle = "rgba(170,0,0," + (a * 0.32 * side) + ")";
    g.fillRect(276, 0, 44, 168);
  } else if (side < -0.2) {
    g.fillStyle = "rgba(170,0,0," + (a * 0.32 * -side) + ")";
    g.fillRect(0, 0, 44, 168);
  }
  if (Math.cos(hitCueAng) < -0.35) {
    g.fillStyle = "rgba(170,0,0," + (a * 0.28) + ")";
    g.fillRect(0, 148, 320, 20);
  }
}

    g.fillRect(166, 94, 6, 2);

    g.fillRect(170, 80, 2, 6);
    g.fillRect(148, 90, 2, 6);
    g.fillRect(170, 90, 2, 6);
  }

  const mx = 252, my = 8, mw = 64, mh = 52;
  g.fillStyle = "rgba(8,4,4,0.7)";
  g.fillRect(mx, my, mw, mh);
  g.fillStyle = "#4a3020";
  g.fillRect(mx, my, mw, 1);
  g.fillRect(mx, my + mh - 1, mw, 1);
  const sw = mw / W, sh = mh / H;
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const ch = cell(c, r);
      if (ch === "#" || ch === " ") continue;
      if (ch === "^") g.fillStyle = "#b88428";
      else if (ch === "g" || ch === "G") g.fillStyle = "#e0b020";
      else if (ch === "l" || ch === "L") g.fillStyle = "#c0c8d0";
      else if (ch === "X" || ch === "*") g.fillStyle = "#30c050";
      else if (ch === ",") g.fillStyle = "#301810";
      else if (ch === "~" || ch === "S" || ch === "t") g.fillStyle = "#6a4030";
      else g.fillStyle = "#4a281c";
      g.fillRect(mx + c * sw, my + r * sh, Math.max(1, sw), Math.max(1, sh));
    }
  }
  if (player) {
    const pc = player.x / TILE + W / 2;
    const pr = player.z / TILE + 2;
    g.fillStyle = "#fff8e0";
    g.fillRect(mx + pc * sw - 1, my + pr * sh - 1, 2, 2);
  }
}

function codeLabel(code) {
  if (!code) return "?";
  if (code.indexOf("Key") === 0) return code.slice(3);
  if (code.indexOf("Digit") === 0) return code.slice(5);
  if (code.indexOf("Arrow") === 0) return code.slice(5).toUpperCase();
  if (code === "Space") return "SPACE";
  if (code.indexOf("Shift") === 0) return "SHIFT";
  if (code.indexOf("Control") === 0) return "CTRL";
  if (code === "Enter" || code === "NumpadEnter") return "ENTER";
  if (code === "AltLeft" || code === "AltRight") return "ALT";
  return String(code).toUpperCase().slice(0, 6);
}

function bindLabel(action) {
  const codes = binds[action] || [];
  const seen = [];
  for (let i = 0; i < codes.length; i++) {
    const lab = codeLabel(codes[i]);
    if (seen.indexOf(lab) < 0) seen.push(lab);
  }
  if (action === "fire") return "CTRL ENTER CLICK";
  return seen.join(" / ") || "?";
}

function addOptHit(id, x, y, w, h) {

function hitOpt(p) {
  for (let i = optHits.length - 1; i >= 0; i--) {
    const h = optHits[i];
    if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h.id;
  }
  return null;
}

function toggleMute() {
  musicMuted = !musicMuted;
  try { localStorage.setItem("rott-music-muted", musicMuted ? "1" : "0"); } catch (err) {}
  if (musicMuted) {
    if (window.pauseTitleMusic) window.pauseTitleMusic();
  } else if (!started && window.playTitleMusic) {
    window.playTitleMusic();
  }
}

function applyBind(action, code) {
  if (!action || !code || code === "Escape") return;
  if (code === "F5" || code === "F11" || code === "Tab") return;
  if (!MOVE_ARROW[action] && code.indexOf("Arrow") === 0) return;
  for (const key of Object.keys(binds)) {
    if (key === action) continue;
    if (MOVE_ARROW[key] === code) continue;
    binds[key] = binds[key].filter((c) => c !== code);
  }
  if (MOVE_ARROW[action]) {
    binds[action] = code === MOVE_ARROW[action] ? [code] : [code, MOVE_ARROW[action]];
    if (code !== MOVE_ARROW[action] && binds[action].indexOf(MOVE_ARROW[action]) < 0) {
      binds[action].push(MOVE_ARROW[action]);
    }
  } else if (action === "run" && (code === "ShiftLeft" || code === "ShiftRight")) {
    binds.run = ["ShiftLeft", "ShiftRight"];
  } else if (action === "fire") {
    binds.fire = keepFireKeys([code]);
  } else {
    binds[action] = [code];
  }
  saveBinds();
}

function uiPos(e) {
  const r = ui.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * UW, y: (e.clientY - r.top) / r.height * UH };
}

function titleButtonAt(p) {
  if (p.y < 166 || p.y > 194) return null;
  if (p.x >= 16 && p.x <= 158) return "play";
  if (p.x >= 166 && p.x <= 304) return "controls";
  return null;
}

function releaseUiFocus() {
  try { ui.blur(); } catch (err) {}
}

function openOptions() {
  if (optionsOpen) return;
  if (screen === "dead" || screen === "win" || screen === "secret") return;
  optionsReturn = started ? "play" : "title";
  optionsOpen = true;
  screen = "options";
  slideDrag = false;
  waitingBind = null;
  mouseDown = false;
  wantLock = false;
  suppressShot = 0;
  ignoreUnlock = true;
  clearKeys();
  ui.style.pointerEvents = "auto";
  try { document.exitPointerLock(); } catch (err) {}
}

function closeOptions(viaClick) {
  if (!optionsOpen) return;
  optionsOpen = false;
  slideDrag = false;
  waitingBind = null;
  mouseDown = false;
  suppressShot = viaClick ? 1 : 0;
  wantLock = false;
  ignoreUnlock = false;
  clearKeys();
  ui.style.pointerEvents = "none";
  releaseUiFocus();
  screen = started ? "play" : "title";
  if (screen === "play") {
    if (renderer && renderer.domElement) {
      renderer.domElement.tabIndex = 0;
      renderer.domElement.focus();
    }
    wantLock = true;
    if (viaClick) {
      lockPointer();
    } else {
      showMsg("CLICK TO LOOK", 2400);
    }
  }
}

function signpostPad(px, pz) {
  const s = findCell("S");
  const sx = worldX(s.c), sz = worldZ(s.r);
  const dx = px - sx, dz = pz - sz;
  const len = Math.hypot(dx, dz) || 1;
  const ux = dx / len, uz = dz / len;
  const yaw = Math.atan2(ux, uz);
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.55);
  shape.lineTo(-0.4, -0.28);
  shape.lineTo(0.4, -0.28);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  for (let i = 1; i <= 3; i++) {
    const t = 2.4 * i;
    const chev = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffd040, side: THREE.DoubleSide }));
    chev.position.set(sx + ux * t, 0.12, sz + uz * t);
    chev.rotation.x = -Math.PI / 2;
    chev.rotation.z = -yaw;
    scene.add(chev);
  }
}

function addDecal(x, y, z, wall) {
  const d = new THREE.Mesh(
    new THREE.CircleGeometry(0.32 + Math.random() * 0.45, 7),
    new THREE.MeshBasicMaterial({ map: bloodTex, transparent: true, depthWrite: false, color: 0xaa2222 })
  );
  if (wall) {
    d.position.copy(wall.pos);
    d.lookAt(wall.pos.clone().add(wall.n));
    d.position.add(wall.n.clone().multiplyScalar(0.03));
  } else {
    d.rotation.x = -Math.PI / 2;
    d.position.set(x, y + 0.03, z);
  }
  scene.add(d);
  decals.push({ mesh: d, life: 22 });
  if (decals.length > 90) {
    const old = decals.shift();
    scene.remove(old.mesh);
  }
}

function nearestWallHit(x, y, z) {
  let best = null, bestD = 1.6;
  for (const s of solids) {
    if (s._open || !s.mesh) continue;
    const cx = Math.max(s.minx, Math.min(x, s.maxx));
    const cy = Math.max(s.miny, Math.min(y, s.maxy));
    const cz = Math.max(s.minz, Math.min(z, s.maxz));
    const d = Math.hypot(x - cx, y - cy, z - cz);
    if (d < bestD) {
      bestD = d;
      const n = new THREE.Vector3(x - cx, y - cy, z - cz);
      if (n.lengthSq() < 0.0001) n.set(0, 0, 1);
      n.normalize();
      best = { pos: new THREE.Vector3(cx, cy, cz), n };
    }
  }
  return best;
}

function overlaps(nx, ny, nz) {
  const r = PLAYER_R;
  for (const s of solids) {
    if (s._open) continue;
    if (nx + r > s.minx && nx - r < s.maxx &&
        ny + 0.15 < s.maxy && ny + PLAYER_H > s.miny &&
        nz + r > s.minz && nz - r < s.maxz) return s;
  }
  return null;
}

function tryMove(dx, dy, dz) {
  let { x, y, z } = player;
  if (!overlaps(x + dx, y, z)) x += dx;
  if (!overlaps(x, y + dy, z)) y += dy;
  else {
    if (dy < 0) { player.onGround = true; player.vy = 0; }
    else player.vy = 0;
  }
  if (!overlaps(x, y, z + dz)) z += dz;
  let floor = 0;
  const col = Math.round(x / TILE + W / 2);
  const row = Math.round(z / TILE + 2);
  const ch = cell(col, row);
  if (ch === ",") floor = -2.2;
  if (ch === "c" && y >= CAT_H - 0.7) floor = CAT_H;
  if (y < floor) { y = floor; player.onGround = true; player.vy = 0; }
  player.x = x; player.y = y; player.z = z;
}

function currentWep() { return weps[wepI]; }

function metalMat(color) {
  return new THREE.MeshBasicMaterial({
    map: metalTex || null,
    color: color || 0xc8c8a0
  });
}

function addPart(parent, geo, mat, x, y, z, rx, ry, rz) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx || 0, ry || 0, rz || 0);

}

function buildPistol(name, x, y, z, yaw) {

  addPart(p, new THREE.BoxGeometry(0.055, 0.04, 0.15), metalMat(0xd8d8b8), 0, 0.04, -0.02);

  addPart(p, new THREE.BoxGeometry(0.022, 0.016, 0.045), metalMat(0x333328), 0, 0.055, -0.11);

    addPart(g, new THREE.BoxGeometry(0.09, 0.16, 0.1), metalMat(0x8a4a14), 0.28, -0.32, -0.3);

function setupGun() {
  gunRoot = new THREE.Group();
  gunRoot.scale.set(1, 1, 1);
  camera.add(gunRoot);
  muzzle = new THREE.PointLight(0xffaa55, 0, 4);
  muzzle.position.set(0.12, -0.28, -0.7);
  camera.add(muzzle);
  gunLight = new THREE.PointLight(0xffcc88, 0.55, 2.2);
  gunLight.position.set(0.08, -0.22, -0.35);
  camera.add(gunLight);
  gunFlash = new THREE.Mesh(
    new THREE.PlaneGeometry(0.1, 0.1),
    new THREE.MeshBasicMaterial({ map: flashTex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
  );
  gunFlash.position.set(0.12, -0.3, -0.68);
  gunFlash.visible = false;
  camera.add(gunFlash);
  swapGun();
}

function swapGun() {
  while (gunRoot.children.length) gunRoot.remove(gunRoot.children[0]);
  gunRoot.add(buildGun(currentWep().id));
}

function fire() {
  const w = currentWep();
  if (reloading > 0) return;
  if (mag[wepI] <= 0) {
    if (w.rocket && reserve[wepI] > 0) {
      const take = Math.min(w.mag, reserve[wepI]);
      mag[wepI] += take;
      reserve[wepI] -= take;
    } else { startReload(); return; }
  }
  const now = performance.now() / 1000;
  if (now - lastShot < 60 / w.rpm) return;
  lastShot = now;
  mag[wepI]--;
  gunKick = w.kick;
  viewPunch = w.kick * 1.6;
  gunRecoil = 1;
  if (w.id === "pistol") pistolHand ^= 1;
  const hx = w.id === "pistol" ? (pistolHand ? -0.12 : 0.12) : 0.14;
  if (muzzle) {
    muzzle.position.set(hx, -0.3, -0.72);
    muzzle.intensity = w.rocket ? 4.2 : 3.4;
    muzzle.visible = true;
  }
  if (gunFlash) {
    gunFlash.position.set(hx, -0.32, -0.7);
    gunFlash.visible = true;
    gunFlash.rotation.z = Math.random() * 6;
  }
  if (w.rocket) {
    if (w.id === "bazooka") SFX.bazooka();
    else if (w.id === "heat") SFX.heat();
    else SFX.drunk();
    launchRockets(w);
  } else {
    if (w.id === "mp40") SFX.mp40(); else SFX.shoot();
    hitscan(w);
  }
  if (mag[wepI] <= 0) startReload();
}

function hitscan(w) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.x += (Math.random() - 0.5) * w.spread;
  dir.y += (Math.random() - 0.5) * w.spread * 0.55;
  dir.z += (Math.random() - 0.5) * w.spread;
  dir.normalize();
  const origin = camera.getWorldPosition(new THREE.Vector3());
  const ray = new THREE.Raycaster(origin, dir, 0, 72);
  let best = null, bestD = 1e9, part = "body";
  for (const e of enemies) {
    if (e.dead) continue;
    const hits = ray.intersectObject(e.group, true);
    if (!hits[0] || hits[0].distance >= bestD) continue;
    best = e;
    bestD = hits[0].distance;
    part = hits[0].point.y > e.y + 1.38 ? "head" : "body";
  }
  for (const b of barrels) {
    if (b.dead) continue;
    const hit = ray.intersectObject(b.mesh, false);
    if (hit[0] && hit[0].distance < bestD) { best = b; bestD = hit[0].distance; part = "barrel"; }
  }
  const end = origin.clone().add(dir.clone().multiplyScalar(best ? bestD : 18));
  const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
  const hx = w.id === "pistol" ? (pistolHand ? -0.28 : 0.26) : 0.2;
  const muzzlePos = origin.clone()
    .add(dir.clone().multiplyScalar(0.75))
    .add(right.multiplyScalar(hx))
    .add(new THREE.Vector3(0, -0.12, 0));
  addTracer(muzzlePos, end);
  if (!best) {
    const wall = nearestWallHit(end.x, end.y, end.z);
    if (wall) addDecal(end.x, end.y, end.z, wall);
    return;
  }
  if (part === "barrel") { boomBarrel(best); return; }
  const dmg = part === "head" ? w.dmg * HEAD_MULT : w.dmg;
  hurtEnemy(best, dmg, part, origin.clone().add(dir.multiplyScalar(bestD)));
}

function addTracer(a, b) {
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffcc66 }));
  scene.add(line);
  tracers.push({ mesh: line, life: 0.05 });
}

function makeRocketMesh(kind) {
  const g = new THREE.Group();
  const fat = kind === "bazooka";
  const bodyCol = kind === "drunk" ? 0xd88828 : kind === "heat" ? 0xc85018 : 0xd4b060;
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(fat ? 0.12 : 0.08, fat ? 0.14 : 0.1, fat ? 0.72 : 0.55, 7),
    metalMat(bodyCol)
  );
  body.rotation.x = Math.PI / 2;
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(fat ? 0.14 : 0.1, fat ? 0.24 : 0.18, 7),
    metalMat(kind === "heat" ? 0xff4410 : 0xf0d878)
  );
  nose.rotation.x = Math.PI / 2;
  nose.position.z = fat ? -0.46 : -0.36;
  const fin = new THREE.Mesh(new THREE.BoxGeometry(fat ? 0.32 : 0.22, 0.04, 0.16), metalMat(0x8a6030));
  fin.position.z = fat ? 0.28 : 0.2;
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(fat ? 0.11 : 0.08, 6, 6),
    new THREE.MeshBasicMaterial({ color: kind === "drunk" ? 0xff7722 : kind === "heat" ? 0xff3311 : 0xffaa44 })
  );
  glow.position.z = fat ? 0.4 : 0.3;
  g.add(body, nose, fin, glow);
  return g;
}

function spawnRocket(kind, origin, dir, wobble) {
  const speed = kind === "bazooka" ? 26 : kind === "heat" ? 19 : 17;
  const mesh = makeRocketMesh(kind);
  mesh.position.copy(origin);
  mesh.lookAt(origin.clone().add(dir));
  scene.add(mesh);
  rockets.push({
    mesh, kind,
    x: origin.x, y: origin.y, z: origin.z,
    vx: dir.x * speed, vy: dir.y * speed, vz: dir.z * speed,
    speed,
    life: kind === "drunk" ? 2.6 : 2.8,
    phase: Math.random() * 6.3,
    wobble: wobble || 0,
    dmg: kind === "bazooka" ? 130 : kind === "heat" ? 90 : 42,
    radius: kind === "bazooka" ? 7.2 : kind === "heat" ? 4.6 : 3.6
  });
}

function launchRockets(w) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const o = camera.getWorldPosition(new THREE.Vector3()).add(dir.clone().multiplyScalar(0.95));
  if (w.rocket === "drunk") {
    for (let i = 0; i < 5; i++) {
      const d = dir.clone();
      d.x += (Math.random() - 0.5) * 0.48;
      d.y += (Math.random() - 0.5) * 0.2;
      d.z += (Math.random() - 0.5) * 0.48;
      d.normalize();
      spawnRocket("drunk", o.clone(), d, 68 + Math.random() * 28);
    }
  } else {
    spawnRocket(w.rocket, o, dir, 0);
  }
}

function rocketHitSolid(x, y, z) {
  for (const s of solids) {
    if (s._open) continue;
    if (x > s.minx && x < s.maxx && y > s.miny && y < s.maxy && z > s.minz && z < s.maxz) return true;
  }
  return false;
}

function nearestEnemy(x, y, z) {
  let best = null, bestD = 36;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, e.y + 1.1 - y, e.z - z);
    if (d < bestD) { best = e; bestD = d; }
  }
  return best;
}

function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    if (r.kind === "heat") {
      const e = nearestEnemy(r.x, r.y, r.z);
      if (e) {
        const dx = e.x - r.x, dy = e.y + 1.05 - r.y, dz = e.z - r.z;
        const len = Math.hypot(dx, dy, dz) || 1;
        const steer = 18 * dt;
        r.vx += (dx / len) * r.speed * steer;
        r.vy += (dy / len) * r.speed * steer;
        r.vz += (dz / len) * r.speed * steer;
        const sp = Math.hypot(r.vx, r.vy, r.vz) || 1;
        r.vx = r.vx / sp * r.speed;
        r.vy = r.vy / sp * r.speed;
        r.vz = r.vz / sp * r.speed;
      }
    }
    if (r.kind === "drunk") {
      r.phase += dt * 16;
      const wx = Math.sin(r.phase) * 12 + Math.sin(r.phase * 2.2) * 6;
      const wy = Math.cos(r.phase * 0.73) * 4.8;
      const wz = Math.cos(r.phase * 1.37) * 12 + Math.sin(r.phase * 0.55) * 5;
      r.x += (r.vx + wx) * dt;
      r.y += (r.vy + wy) * dt;
      r.z += (r.vz + wz) * dt;
    } else {
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      r.z += r.vz * dt;
    }
    r.life -= dt;
    r.mesh.position.set(r.x, r.y, r.z);
    r.mesh.lookAt(r.x + r.vx, r.y + r.vy, r.z + r.vz);
    if (Math.random() < 0.6) {
      const spark = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.06), new THREE.MeshBasicMaterial({ color: r.kind === "heat" ? 0xff3311 : 0xff7722 }));
      spark.position.set(r.x, r.y, r.z);
      scene.add(spark);
      gibs.push({ mesh: spark, vx: 0, vy: 0.2, vz: 0, life: 0.12 });
    }
    let hit = r.y < 0.12 || rocketHitSolid(r.x, r.y, r.z) || r.life <= 0;
    let victim = null;
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - r.x, e.z - r.z) < 0.7 && Math.abs(e.y + 1 - r.y) < 1.1) { hit = true; victim = e; break; }
    }
    for (const b of barrels) {
      if (!b.dead && Math.hypot(b.x - r.x, b.z - r.z) < 0.8) { hit = true; boomBarrel(b); }
    }
    if (hit) {
      explode(r.x, r.y, r.z, r.dmg, r.radius);
      if (victim && !victim.dead) hurtEnemy(victim, r.dmg * 0.35, "body", new THREE.Vector3(r.x, r.y, r.z));
      scene.remove(r.mesh);
      rockets.splice(i, 1);
    }
  }
}

function explode(x, y, z, dmg, radius) {
  SFX.boom();
  spawnGibs(x, y, z, radius > 6 ? 32 : 22, 0x442200);
  dmg = dmg == null ? 95 : dmg;
  radius = radius == null ? 5.6 : radius;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, e.z - z);
    if (d < radius) hurtEnemy(e, dmg * (1 - d / radius), "body", new THREE.Vector3(e.x, 1, e.z));
  }
  for (const b of barrels) {
    if (!b.dead && Math.hypot(b.x - x, b.z - z) < radius * 0.75) boomBarrel(b);
  }
  const pd = Math.hypot(player.x - x, player.z - z);
  if (pd < radius * 0.75) hurtPlayer(42 * (1 - pd / (radius * 0.75)), x, z);
}

function boomBarrel(b) {
  if (b.dead) return;
  b.dead = true;
  b.mesh.visible = false;
  if (b.solid) b.solid._open = true;
  explode(b.x, 0.6, b.z);
}

function hurtEnemy(e, dmg, part, hit) {
  e.hp -= dmg;
  e.hurt = 0.28;
  e.flinch = 0.22;
  hitMarkT = 0.22;
  e.head.material.emissive = new THREE.Color(part === "head" ? 0xcc2000 : 0x881000);
  spawnGibs(e.x, 1.1, e.z, part === "head" ? 18 : 10);
  blast(0.05, 0.55, 1800, "highpass", 0.8);
  kick(90, 0.08, 0.45);
  playOsc(220, 0.07, "square", 0.16, 80);
  addDecal(e.x, e.y + 0.02, e.z);
  const wall = nearestWallHit(e.x, 1.2, e.z);
  if (wall) addDecal(e.x, 1.2, e.z, wall);
  if (e.hp <= 0) killEnemy(e, part === "head" || dmg > 50);
}

function killEnemy(e, gibby) {
  if (e.dead) return;
  e.dead = true;
  e.state = "dead";
  SFX.death();
  spawnGibs(e.x, 1.2, e.z, gibby ? 36 : 24);
  addDecal(e.x, e.y + 0.02, e.z);
  const wall = nearestWallHit(e.x, 1.1, e.z);
  if (wall) addDecal(e.x, 1.1, e.z, wall);
  e.group.visible = false;
  if (performance.now() / 1000 > tauntT) {
    showMsg(TAUNTS[(Math.random() * TAUNTS.length) | 0], 1100);
    tauntT = performance.now() / 1000 + 2.4;
  }
}

function markHitDir(fromX, fromZ) {
  if (!player || fromX == null || fromZ == null) return;
  const lookX = -Math.sin(player.yaw);
  const lookZ = -Math.cos(player.yaw);
  const hx = fromX - player.x;
  const hz = fromZ - player.z;
  const fwd = hx * lookX + hz * lookZ;
  const right = hx * lookZ - hz * lookX;
  hitCueAng = Math.atan2(right, fwd);
  hitCueT = 0.58;
}

function hurtPlayer(n, fromX, fromZ) {
  if (!player || optionsOpen || invulnT > 0 || timeAlive < 3.2) return;
  const soak = Math.min(player.armor, n * 0.6);
  player.armor -= soak;
  player.hp -= (n - soak);
  dmgT = 0.38;
  faceHurt = 0.45;
  markHitDir(fromX, fromZ);
  SFX.pain();
  if (player.hp <= 0) die();
}

function die() {
  pointerLocked = false;
  optionsOpen = false;
  slideDrag = false;
  stopAmbience();
  document.exitPointerLock();
  started = false;
  screen = "dead";
  ui.style.pointerEvents = "none";
  ui.classList.remove("play");
  if (window.playTitleMusic) window.playTitleMusic();
}

function win(secret) {
  pointerLocked = false;
  optionsOpen = false;
  slideDrag = false;
  stopAmbience();
  document.exitPointerLock();
  started = false;
  screen = secret ? "secret" : "win";
  ui.style.pointerEvents = "none";
  ui.classList.remove("play");
  if (window.playTitleMusic) window.playTitleMusic();
}

function startReload() {
  if (reloading > 0) return;
  const w = currentWep();
  if (w.rocket) return;
  if (mag[wepI] >= w.mag || reserve[wepI] <= 0) return;
  reloading = 0.85;
  SFX.reload();
}

function finishReload() {
  const w = currentWep();
  const need = w.mag - mag[wepI];
  const take = Math.min(need, reserve[wepI]);
  mag[wepI] += take;
  reserve[wepI] -= take;
}

function use() {
  for (const d of doors) {
    if (d.open) continue;
    if (Math.hypot(player.x - d.x, player.z - d.z) < 2.5) {
      if (d.kind === "gold" && !keys.gold) { showMsg("NEED GOLD KEY"); return; }
      if (d.kind === "silver" && !keys.silver) { showMsg("NEED SILVER KEY"); return; }
      if (d.kind === "timed") { showMsg("LOCKED - WAIT 3:00"); return; }
      d.open = true;
      d.solid._open = true;
      SFX.door();
      showMsg(d.kind === "free" ? "DOOR" : d.kind.toUpperCase() + " DOOR");
      return;
    }
  }
  for (const p of pushwalls) {
    if (p.pushed) continue;
    if (Math.hypot(player.x - p.x, player.z - p.z) < 2.7) {
      p.pushed = true;
      p.solid._open = true;
      SFX.door();
      showMsg("PUSHWALL");
      return;
    }
  }
}

function takePickup(p) {
  p.taken = true;
  p.mesh.visible = false;
  SFX.pickup();
  showMsg(p.label);
  if (p.kind === "gold") keys.gold = true;
  if (p.kind === "silver") keys.silver = true;
  if (p.kind === "mp40") { have[1] = true; reserve[1] += 64; mag[1] = 32; wepI = 1; swapGun(); }
  if (p.kind === "bazooka") { have[2] = true; reserve[2] += 8; if (mag[2] === 0) mag[2] = 6; wepI = 2; swapGun(); }
  if (p.kind === "heat") { have[3] = true; reserve[3] += 6; if (mag[3] === 0) mag[3] = 5; wepI = 3; swapGun(); }
  if (p.kind === "drunk") { have[4] = true; reserve[4] += 5; if (mag[4] === 0) mag[4] = 4; wepI = 4; swapGun(); }
  if (p.kind === "health") player.hp = Math.min(100, player.hp + 25);
  if (p.kind === "ammo") reserve[wepI] += weps[wepI].rocket ? 3 : 24;
  if (p.kind === "secret") win(true);
}

function findCell(ch) {
  for (let r = 0; r < H; r++) {
    const c = MAP[r].indexOf(ch);
    if (c >= 0) return { c, r };
  }
  return { c: 5, r: 3 };
}

function resetPlayer() {
  const s = findCell("S");
  const px = worldX(s.c);
  const pz = worldZ(s.r);
  player = {
    x: px, y: 0, z: pz,
    yaw: -Math.PI / 2,
    pitch: 0.12,
    vx: 0, vy: 0, vz: 0,
    onGround: true, hp: 100, armor: 0,
    _k: held
  };
  keys.gold = keys.silver = false;
  wepI = 0;
  mag = [24, 32, 6, 5, 4];
  reserve = [96, 64, 8, 6, 5];
  have = [true, true, true, true, true];
  pistolHand = 0;
  viewPunch = 0;
  gunKick = 0;
  gunRecoil = 0;
  timeAlive = 0;
  invulnT = 3.2;
  hitCueT = 0;
  hitMarkT = 0;
  if (gunRoot) swapGun();
}

function losBlock(ch) {
  return isWall(ch) || ch === "D" || ch === "g" || ch === "l" || ch === "Q" || ch === "t";
}

function blockedCell(x, z) {
  const c = Math.round(x / TILE + W / 2);
  const r = Math.round(z / TILE + 2);
  return losBlock(cell(c, r));
}

function doorClosedAt(c, r) {
  const wx = worldX(c), wz = worldZ(r);
  for (let i = 0; i < doors.length; i++) {
    const d = doors[i];
    if (Math.abs(d.x - wx) < 0.4 && Math.abs(d.z - wz) < 0.4) return !d.open;
  }
  return true;
}

function pushClosedAt(c, r) {
  const wx = worldX(c), wz = worldZ(r);
  for (let i = 0; i < pushwalls.length; i++) {
    const p = pushwalls[i];
    if (Math.abs(p.x - wx) < 0.4 && Math.abs(p.z - wz) < 0.4) return !p.pushed;
  }
  return true;
}

function blocksSight(x, z) {
  const c = Math.round(x / TILE + W / 2);
  const r = Math.round(z / TILE + 2);
  const ch = cell(c, r);
  if (isWall(ch) || ch === "t") return true;
  if (ch === "D" || ch === "g" || ch === "l" || ch === "Q") return doorClosedAt(c, r);
  if (ch === "P") return pushClosedAt(c, r);
  return false;
}

function hasLOS(e) {
  const dx = player.x - e.x, dz = player.z - e.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.5) return true;
  const steps = Math.max(6, Math.ceil(dist / 0.4));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (blocksSight(e.x + dx * t, e.z + dz * t)) return false;
  }
  return true;
}

function updateEnemy(e, dt) {
  if (e.dead) return;
  if (e.hurt > 0) {
    e.hurt -= dt;
    if (e.hurt <= 0) e.head.material.emissive.setHex(0x000000);
  }
  if (e.flinch > 0) e.flinch -= dt;
  const dx = player.x - e.x, dz = player.z - e.z;
  const dist = Math.hypot(dx, dz) || 0.001;
  if (invulnT > 0 || timeAlive < 3.2) return;
  if (nearSpawn(player.x, player.z)) return;
  if (timeAlive < 28 && !e.opener) return;
  const los = dist < 36 && hasLOS(e);
  if (los) e.state = dist < 11 ? "shoot" : "chase";
  else if (e.state === "shoot" || e.state === "chase") e.state = "idle";
  const sp = (e.tough ? 4.4 : 3.6) * dt;
  function walk(wx, wz) {
    const nx = e.x + wx, nz = e.z + wz;
    if (!blockedCell(nx, e.z)) e.x = nx;
    if (!blockedCell(e.x, nz)) e.z = nz;
  }
  if (e.state === "chase") walk((dx / dist) * sp, (dz / dist) * sp);
  if (e.state === "shoot") {
    walk(-dz / dist * dt * 1.8, dx / dist * dt * 1.8);
    if (dist < 4.2) walk(-(dx / dist) * sp, -(dz / dist) * sp);
    e.nextShot -= dt;
    if (e.nextShot <= 0 && los && dist < 14) {
      const chip = e.opener || timeAlive < 28;
      e.nextShot = e.tough ? 0.55 : (chip ? 2.1 : 1.0);
      SFX.enemyShot();
      const origin = new THREE.Vector3(e.x, 1.3, e.z);
      const dest = new THREE.Vector3(player.x, player.y + 1.3, player.z);
      addTracer(origin, dest);
      const acc = e.tough ? 0.7 : (chip ? 0.16 : 0.48);
      const dmg = e.tough ? 11 : (chip ? 2 : 6);
      if (Math.random() < acc) hurtPlayer(dmg, e.x, e.z);
    }
  }
  const kick = e.flinch > 0 ? 0.18 : 0;
  e.group.position.set(e.x + (Math.random() - 0.5) * kick, e.y, e.z + (Math.random() - 0.5) * kick);
  e.group.lookAt(player.x, e.y, player.z);
}

      if (ch === "U") makePickup(x, 0.6, z, "drunk", new THREE.MeshLambertMaterial({ color: 0x8a6a20, emissive: 0x332200, flatShading: true }), "DRUNK MISSILES");
      if (ch === "H") makeMonkMeal(x, 0.6, z, r <= 7);
      if (ch === "A") makePickup(x, 0.6, z, "ammo", new THREE.MeshLambertMaterial({ color: 0xc8a020, flatShading: true }), "AMMO");

      if (ch === "D" || ch === "g" || ch === "l" || ch === "Q") {

      if (ch === "P") {

        pushwalls.push({ x, z, mesh: pw, solid: solids[solids.length - 1], pushed: false, t: 0 });
      }
      if (ch === "Y") {
        const plat = boxAt(x, 0, z, TILE * 0.95, 0.22, TILE * 0.95, mMetal, true);

  const extraPads = [

  for (const [c, r, y] of extraPads) {

  }
  if (!pads.some((p) => p.yard)) {
    const s = findCell("S");
    placePad(worldX(s.c + 5), 0, worldZ(s.r + 2), true, true);

  const yardPad = pads.find((p) => p.yard);

  for (let r = 0; r < H; r++) {

}

function lockEl() {
  return (renderer && renderer.domElement) || document.body;
}

function isLocked() {
  const el = document.pointerLockElement || document.mozPointerLockElement;
  return !!el;
}

function lockPointer() {
  const el = lockEl();
  const req = el.requestPointerLock || el.mozRequestPointerLock;
  if (!req) return;
  try {
    const p = req.call(el);
    if (p && p.catch) p.catch(() => {});
  } catch (err) {}
}

function setKey(e, down) {
  if (!e) return;
  if (e.code) keysDown[e.code] = down;
  const key = (e.key || "").toLowerCase();
  if (e.key === "ArrowUp" || e.code === "ArrowUp") keysDown.ArrowUp = down;
  if (e.key === "ArrowDown" || e.code === "ArrowDown") keysDown.ArrowDown = down;
  if (e.key === "ArrowLeft" || e.code === "ArrowLeft") keysDown.ArrowLeft = down;
  if (e.key === "ArrowRight" || e.code === "ArrowRight") keysDown.ArrowRight = down;
  if (key === "control" || (e.code && e.code.indexOf("Control") === 0)) {
    keysDown.ControlLeft = down;
    keysDown.ControlRight = down;
  }
  if (key === "enter" || e.code === "Enter" || e.code === "NumpadEnter") {
    keysDown.Enter = down;
    keysDown.NumpadEnter = down;
  }
}

function startGame() {
  if (started) return;
  if (!scene) return;
  initAudio();
  if (window.pauseTitleMusic) window.pauseTitleMusic();
  resetPlayer();
  if (camera && player) {
    camera.position.set(player.x, player.y + PLAYER_H, player.z);
    camera.rotation.order = "YXZ";
    camera.rotation.y = -player.yaw;
    camera.rotation.x = player.pitch;
  }
  for (const e of enemies) {
    e.dead = false; e.hp = e.max; e.group.visible = true; e.state = "idle";
    e.nextShot = 2.8 + Math.random();
    e.head.material.emissive.setHex(0x000000);
  }
  for (const p of pickups) { p.taken = false; p.mesh.visible = true; }
  for (const d of doors) {
    d.open = false;
    if (d.solid) d.solid._open = false;
    d.mesh.position.y = (WALL_H - 0.12) / 2;
  }
  for (const p of pushwalls) {
    p.pushed = false; p.t = 0;
    p.mesh.position.z = p.z;
    if (p.solid) p.solid._open = false;
  }
  for (const b of barrels) {
    b.dead = false; b.mesh.visible = true;
    if (b.solid) b.solid._open = false;
  }
  for (const r of rockets) scene.remove(r.mesh);
  rockets.length = 0;
  started = true;
  screen = "play";
  ui.style.pointerEvents = "none";
  if (renderer && renderer.domElement) {
    renderer.domElement.tabIndex = 0;
    renderer.domElement.focus();
  }
  const bootSound = () => {
    if (!started) return;
    startAmbience();
    SFX.step("dirt", true);
  };
  if (ac && ac.state !== "running" && ac.resume) {
    ac.resume().then(bootSound).catch(bootSound);
  } else {
    bootSound();
  }
  lockPointer();
  showMsg("CTRL ENTER FIRE", 2200);
}

function clickOptions(p) {
  const id = hitOpt(p);
  if (!id) return;
  if (id === "slider") {
    slideDrag = true;
    sensFromUiX(p.x);
    return;
  }
  if (id === "mute") { toggleMute(); return; }
  if (id === "reset") {
    binds = defaultBinds();
    saveBinds();
    setSens(1);
    waitingBind = null;
    return;
  }
  if (id === "back") { closeOptions(true); return; }
  waitingBind = waitingBind === id ? null : id;
}

function bind() {
  if (player) player._k = keysDown;
  const onStartClick = (e) => {
    initAudio();
    if (e && e.button != null && e.button !== 0) return;
    if (optionsOpen) return;
    if (!started && screen === "title") {
      const hit = titleButtonAt(uiPos(e));
      if (hit === "controls") {
        openOptions();
        if (e.preventDefault) e.preventDefault();
        return;
      }
    }
    if (!started) startGame();
    if (started && screen === "play" && !isLocked()) lockPointer();
    else if (!isLocked()) lockPointer();
  };
  window.addEventListener("pointerdown", onStartClick, true);
  const onLockChange = () => {
    pointerLocked = isLocked();
    if (optionsOpen || ignoreUnlock) {
      if (!pointerLocked && ignoreUnlock) ignoreUnlock = false;
      return;
    }
    if (started && screen === "play" && !pointerLocked) {
      wantLock = true;
      showMsg("CLICK TO LOOK", 2400);
    }
  };
  document.addEventListener("pointerlockchange", onLockChange);
  document.addEventListener("mozpointerlockchange", onLockChange);
  window.addEventListener("mousemove", (e) => {
    if (optionsOpen && slideDrag) {
      sensFromUiX(uiPos(e).x);
      return;
    }
    if (!started || !player || optionsOpen) return;
    if (!isLocked() && !pointerLocked && !mouseDown) return;
    player.yaw -= e.movementX * 0.00215 * lookSens;
    player.pitch -= e.movementY * 0.00215 * lookSens;
    player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch));
  }, true);
  ui.addEventListener("pointerdown", (e) => {
    if (!optionsOpen) return;
    clickOptions(uiPos(e));
    e.preventDefault();
    releaseUiFocus();
  });
  window.addEventListener("pointerup", () => { slideDrag = false; }, true);
  const onKeyDown = (e) => {
    initAudio();
    if (optionsOpen) {
      e.preventDefault();
      if (e.code === "Escape") {
        if (waitingBind) waitingBind = null;
        else closeOptions(false);
        return;
      }
      if (waitingBind) {
        applyBind(waitingBind, e.code);
        waitingBind = null;
        return;
      }
      if (e.code === "ArrowLeft") setSens(lookSens - 0.1);
      if (e.code === "ArrowRight") setSens(lookSens + 0.1);
      if (e.code === "KeyM") toggleMute();
      return;
    }
    if (started && (/^(Arrow|Space|KeyW|KeyA|KeyS|KeyD|Shift|Control|Enter)/.test(e.code || "") || e.key === " " || e.key === "Control" || e.key === "Enter")) {
      e.preventDefault();
    }
    setKey(e, true);
    if (started && !optionsOpen && isFireEvent(e)) {
      e.preventDefault();
      fire();
    }
    if (e.code === "KeyM" && !started) toggleMute();
    if (e.code === "Escape") {
      e.preventDefault();
      if (screen === "title" || started) openOptions();
      return;
    }
    if (!started) return;
    if (codeIs("use", e.code)) use();
    if (codeIs("reload", e.code)) startReload();
    if (codeIs("wep1", e.code) && have[0]) { wepI = 0; swapGun(); }
    if (codeIs("wep2", e.code) && have[1]) { wepI = 1; swapGun(); }
    if (codeIs("wep3", e.code) && have[2]) { wepI = 2; swapGun(); }
    if (codeIs("wep4", e.code) && have[3]) { wepI = 3; swapGun(); }
    if (codeIs("wep5", e.code) && have[4]) { wepI = 4; swapGun(); }
    if (/^(Space|Arrow|KeyW|KeyA|KeyS|KeyD|Shift|Control|Enter)/.test(e.code) || e.key === " ") e.preventDefault();
  };
  window.addEventListener("keydown", onKeyDown, true);
  window.addEventListener("keyup", (e) => {
    if (optionsOpen) return;
    setKey(e, false);
  }, true);
  window.addEventListener("mousedown", (e) => {
    initAudio();
    if (!started || optionsOpen) return;
    if (e.button !== 0 && e.button !== 2) return;
    if (!isLocked()) lockPointer();
    if (suppressShot) { suppressShot = 0; return; }
    mouseDown = true;
    fire();
  }, true);
  window.addEventListener("mouseup", () => { mouseDown = false; }, true);
  window.addEventListener("contextmenu", (e) => {
    if (started && !optionsOpen) e.preventDefault();
  }, true);
  window.addEventListener("wheel", (e) => {
    if (!started || optionsOpen) return;
    const dir = e.deltaY > 0 ? 1 : -1;
    for (let i = 0; i < 5; i++) {
      wepI = (wepI + dir + 5) % 5;
      if (have[wepI]) break;
    }
    swapGun();
  }, { passive: true, capture: true });
}

function tick(dt) {
  titleT += dt;
  if (lightning > 0) lightning -= dt * 3;
  else if (Math.random() < dt * 0.15) lightning = 1;
  if (!started || !player) return;
  if (optionsOpen) {
    updateAmbience(dt, false, false, false);
    return;
  }
  timeAlive += dt;
  if (invulnT > 0) invulnT -= dt;
  if (msgT > 0) msgT -= dt;
  if (dmgT > 0) dmgT -= dt;
  if (hitCueT > 0) hitCueT -= dt;
  if (hitMarkT > 0) hitMarkT -= dt;
  if (faceHurt > 0) faceHurt -= dt;
  if (landDip > 0) landDip -= dt * 4;

  let ix = 0, iz = 0;
  if (actionHeld("fwd") || held.ArrowUp) iz -= 1;
  if (actionHeld("back") || held.ArrowDown) iz += 1;
  if (actionHeld("left") || held.ArrowLeft) ix -= 1;
  if (actionHeld("right") || held.ArrowRight) ix += 1;
  const running = actionHeld("run");
  const sp = running ? RUN : MOVE;
  const len = Math.hypot(ix, iz) || 1;
  const cy = Math.cos(player.yaw), sy = Math.sin(player.yaw);
  const wishX = (ix / len) * cy + (iz / len) * sy;
  const wishZ = (iz / len) * cy - (ix / len) * sy;
  const moving = ix || iz;
  const airborne = !player.onGround;
  updateAmbience(dt, !!moving, running, airborne);
  if (moving) {
    bob += dt * (running ? 26 : 17);
    if (airborne) {
      airT += dt;
      if (airT >= 0.2) {
        airT = 0;
        SFX.air();
      }
    } else {
      const period = running ? 0.26 : 0.4;
      stepT += dt;
      if (stepT >= period) {
        stepT -= period;
        SFX.step(floorKind(), running);
      }
    }
  } else {
    stepT = 99;
    airT = 0;
  }

  if (actionHeld("jump") && player.onGround) { player.vy = JUMP; player.onGround = false; SFX.jump(); }
  player.vy -= GRAV * dt;
  wasOnGround = player.onGround;
  player.onGround = false;
  tryMove(wishX * sp * dt, player.vy * dt, wishZ * sp * dt);
  if (player.onGround && !wasOnGround && player.vy < -6) {
    landDip = 0.18;
    SFX.step(floorKind(), true);
  }

  for (const p of pads) {
    p.cool = Math.max(0, p.cool - dt);
    p.flash = Math.max(0, p.flash - dt * 3);
    p.nub.material.emissive.setHex(p.flash > 0 ? 0xee8800 : (p.yard ? 0xcc6600 : 0x553300));
    const bobY = Math.sin(titleT * 8 + p.x) * (p.yard ? 0.12 : 0.02);
    p.disk.position.y = (p.yard ? 0.14 : 0.1) + bobY + (p.flash > 0 ? 0.08 : 0);
    if (p.yard) p.group.position.y = p.y + bobY * 0.45;
    if (p.column && p.column.material) {
      p.column.material.opacity = 0.38 + Math.sin(titleT * 6 + p.x) * 0.22;
      p.column.scale.y = 1 + Math.sin(titleT * 5 + p.z) * 0.08;
    }
    if (p.cool > 0) continue;
    if (Math.hypot(player.x - p.x, player.z - p.z) < (p.yard ? 1.62 : 1.18) && player.y < p.y + 1.25 && player.y > p.y - 0.4) {
      player.vy = PAD_UP;
      player.onGround = false;
      if (moving) {
        player.x += wishX * 0.22;
        player.z += wishZ * 0.22;
      }
      p.cool = 0.4;
      p.flash = 1;
      SFX.pad();
    }
  }

  for (const p of pickups) {
    if (p.taken) continue;
    p.mesh.rotation.y += dt * 2.5;
    p.mesh.position.y = p.y + Math.sin(titleT * 4 + p.x) * 0.08;
    if (Math.hypot(player.x - p.x, player.z - p.z) < 1.1 && Math.abs(player.y - p.y) < 1.7) takePickup(p);
  }

  for (const d of doors) {
    if (d.open && d.mesh.position.y < WALL_H * 1.55) d.mesh.position.y += dt * 5.2;
  }
  for (const p of pushwalls) {
    if (p.pushed && p.t < 1) {
      p.t = Math.min(1, p.t + dt * 0.7);
      p.mesh.position.z = p.z + p.t * TILE * 2.2;
    }
  }
  for (const el of elevators) {
    el.phase += dt * 0.35;
    const y = 0.1 + (Math.sin(el.phase) * 0.5 + 0.5) * 5.5;
    el.mesh.position.y = y + 0.11;
    if (el.solid) { el.solid.miny = y; el.solid.maxy = y + 0.3; }
    if (Math.hypot(player.x - el.x, player.z - el.z) < 1.4 && player.y < y + 1.5 && player.y > y - 0.4) {
      player.y = y + 0.25;
      player.vy = 0;
      player.onGround = true;
    }
  }

  if (timedDoor && timeAlive >= 180 && timeAlive <= 300 && !timedDoor.open) {
    timedDoor.open = true;
    if (timedDoor.solid) timedDoor.solid._open = true;
    showMsg("TIMED DOOR OPEN");
    SFX.door();
  }
  if (timedDoor && timeAlive > 300 && timedDoor.open) {
    timedDoor.open = false;
    if (timedDoor.solid) timedDoor.solid._open = false;
    timedDoor.mesh.position.y = (WALL_H - 0.12) / 2;
    showMsg("TIMED DOOR SHUT");
  }

  if (exitTrig && Math.hypot(player.x - exitTrig.x, player.z - exitTrig.z) < 1.5) win(false);

  if (reloading > 0) {
    reloading -= dt;
    if (reloading <= 0) finishReload();
  }
  if (ac && ac.state !== "running") initAudio();
  if (fireHeld()) fire();

  for (const e of enemies) updateEnemy(e, dt);
  updateRockets(dt);

  for (let i = gibs.length - 1; i >= 0; i--) {
    const g = gibs[i];
    g.vy -= GRAV * dt;
    g.mesh.position.x += g.vx * dt;
    g.mesh.position.y += g.vy * dt;
    g.mesh.position.z += g.vz * dt;
    g.mesh.rotation.x += dt * 8;
    g.mesh.rotation.z += dt * 6;
    if (g.mesh.position.y < 0.05) {
      g.mesh.position.y = 0.05; g.vy *= -0.22; g.vx *= 0.58; g.vz *= 0.58;
      if (g.decal) { addDecal(g.mesh.position.x, 0, g.mesh.position.z); g.life = 0; }
      if (g.nade) { explode(g.mesh.position.x, 0.3, g.mesh.position.z); g.life = 0; }
    }
    g.life -= dt;
    if (g.life <= 0) {
      if (g.nade) explode(g.mesh.position.x, g.mesh.position.y, g.mesh.position.z);
      scene.remove(g.mesh);
      gibs.splice(i, 1);
    }
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    tracers[i].life -= dt;
    if (tracers[i].life <= 0) {
      scene.remove(tracers[i].mesh);
      tracers.splice(i, 1);
    }
  }

  gunKick *= 0.84;
  viewPunch *= 0.88;
  gunRecoil *= 0.76;
  if (gunFlash && gunRecoil < 0.25) gunFlash.visible = false;
  if (muzzle && muzzle.intensity > 0) {
    muzzle.intensity *= 0.55;
    if (muzzle.intensity < 0.2) { muzzle.intensity = 0; muzzle.visible = false; }
  }
  camera.position.set(player.x, player.y + PLAYER_H + Math.sin(bob) * 0.22 - landDip * 0.28, player.z);
  camera.rotation.order = "YXZ";
  camera.rotation.y = -player.yaw + viewPunch * (pistolHand ? -0.09 : 0.09);
  camera.rotation.x = player.pitch + gunKick + viewPunch * 0.35 + Math.sin(bob * 2) * (moving ? 0.035 : 0);
  camera.rotation.z = (moving ? -ix * 0.07 : camera.rotation.z * 0.8) + viewPunch * 0.14;
  if (gunRoot) {
    gunRoot.position.y = -0.08 + Math.sin(bob) * 0.02 - gunRecoil * 0.04;
    gunRoot.position.x = Math.cos(bob) * 0.012;
    gunRoot.position.z = gunRecoil * 0.08;
    gunRoot.rotation.x = gunRecoil * 0.18;
    const left = gunRoot.getObjectByName("leftPistol");
    const right = gunRoot.getObjectByName("rightPistol");
    if (left && right) {
      left.position.z = -0.7 + (pistolHand ? gunRecoil * 0.08 : 0);
      right.position.z = -0.72 + (pistolHand ? 0 : gunRecoil * 0.08);
    }
  }
}

function drawUI() {
  if (screen === "title") paintTitle(ug, titleT);
  else if (screen === "dead") paintEnd(ug, "YOU DIED", "CLICK TO RISE AGAIN");
  else if (screen === "win") paintEnd(ug, "LEVEL COMPLETE", "THE HUNT CONTINUES");
  else if (screen === "secret") paintEnd(ug, "SECRET EXIT", "DELUXE PATH");
  else if (screen === "options") {
    if (started) paintHUD(ug);
    else paintTitle(ug, titleT);
    paintOptions(ug);
  }
  else paintHUD(ug);
}

function loop() {
  requestAnimationFrame(loop);
  try {
    const dt = Math.min(0.033, clock.getDelta());
    tick(dt);
    if (started && renderer) {
      renderer.setRenderTarget(rt);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      quadMat.uniforms.tDiffuse.value = rt.texture;
      renderer.render(quadScene, quadCam);
    }
    drawUI();
  } catch (err) {
    if (window.console) console.error(err);
  }
}

function main() {
  if (THREE.ColorManagement) THREE.ColorManagement.enabled = false;
  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: "high-performance" });
  renderer.setSize(VW, VH, false);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.domElement.id = "view";
  renderer.domElement.tabIndex = 0;
  renderer.domElement.style.imageRendering = "pixelated";
  document.body.insertBefore(renderer.domElement, ui);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, VW / VH, 0.08, 340);
  camera.rotation.order = "YXZ";
  scene.add(camera);
  clock = new THREE.Clock();
  rt = new THREE.WebGLRenderTarget(VW, VH, {
    magFilter: THREE.NearestFilter,
    minFilter: THREE.NearestFilter,
    generateMipmaps: false
  });
  quadScene = new THREE.Scene();
  quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  quadMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }",
    fragmentShader: [
      "uniform sampler2D tDiffuse; varying vec2 vUv;",
      "void main(){",
      "  vec4 c = texture2D(tDiffuse, vUv);",
      "  float bayer = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453);",
      "  c.rgb = c.rgb * 2.05 + vec3(0.16, 0.08, 0.03);",
      "  c.rgb = floor(c.rgb * 28.0 + bayer * 0.25) / 28.0;",
      "  float scan = 0.97 + 0.03 * step(0.5, fract(gl_FragCoord.y * 0.5));",
      "  c.rgb *= scan;",
      "  gl_FragColor = c;",
      "}"
    ].join("\n")
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat);
  quadScene.add(quad);
  makeTextures();
  buildLevel();
  setupGun();
  resetPlayer();
  camera.position.set(player.x, player.y + PLAYER_H, player.z);
  bind();
  setupTitleMusic();
  addEventListener("resize", () => {});
  loop();
  if (location.search.indexOf("autostart") >= 0) {
    try { startGame(); } catch (err) {}
  }
}

window.addEventListener("load", () => {
  if (typeof THREE === "undefined") {
    ug.fillStyle = "#000";
    ug.fillRect(0, 0, UW, UH);
    drawText(ug, "COULD NOT LOAD THREE.JS", 160, 90, "#e02020", 1, "center");
    return;
  }
  try { main(); }
  catch (err) {
    if (window.console) console.error(err);
    ug.fillStyle = "#000";
    ug.fillRect(0, 0, UW, UH);
    drawText(ug, "BOOT FAILED", 160, 90, "#e02020", 1, "center");
    if (err && err.message) drawText(ug, String(err.message).slice(0, 36), 160, 110, "#c9a66b", 1, "center");
  }
});
})();
</script>
