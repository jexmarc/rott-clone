  );
  sky.position.y = 12;
  scene.add(sky);
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(7.2, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffe8b8, fog: false })
  );
  moon.position.set(78, 36, 10);
  scene.add(moon);
  const spawnCell = findCell("S");
  const spawnFill = new THREE.PointLight(0xffc040, 0.85, 16, 1.4);
  spawnFill.position.set(worldX(spawnCell.c), CAT_H + 2.2, worldZ(spawnCell.r));
  scene.add(spawnFill);
  const fx = worldX(14), fz = worldZ(16);
  const basin = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.32, 0.36, 10), new THREE.MeshLambertMaterial({ color: 0x6a4a30, emissive: 0x1a1008, flatShading: true }));
  basin.position.set(fx, 0.18, fz);
  scene.add(basin);
  const water = new THREE.Mesh(new THREE.CylinderGeometry(0.88, 0.88, 0.12, 10), new THREE.MeshLambertMaterial({ color: 0x3a6a78, emissive: 0x0a2030, flatShading: true }));
  water.position.set(fx, 0.4, fz);
  scene.add(water);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 1.15, 8), new THREE.MeshLambertMaterial({ color: 0x5a4030, emissive: 0x140c08, flatShading: true }));
  stem.position.set(fx, 0.98, fz);
  scene.add(stem);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.36, 0.24, 8), new THREE.MeshLambertMaterial({ color: 0x3a6870, emissive: 0x0a2028, flatShading: true }));
  top.position.set(fx, 1.6, fz);
  scene.add(top);
  const fountLit = new THREE.PointLight(0x88a8b8, 0.35, 8, 1.6);
  fountLit.position.set(fx, 2.2, fz);
  scene.add(fountLit);
  for (let i = 0; i < ZONES.length; i++) {
    const z = ZONES[i];
    const cx = worldX((z.c0 + z.c1) / 2);
    const cz = worldZ((z.r0 + z.r1) / 2);
    const col = z.theme === "fire" ? 0xff6030 : (z.theme === "exit" ? 0x50ff80 : (z.theme === "silver" ? 0xa0c0e0 : (z.outdoor ? 0x88a0c8 : 0xffb060)));
    const lit = new THREE.PointLight(col, z.outdoor ? 0.45 : 0.8, z.outdoor ? 22 : 14, 1.3);
    lit.position.set(cx, z.elevated ? CAT_H + 2.2 : 3.1, cz);
    scene.add(lit);
    if (!z.outdoor) {
      const plaque = makeLabel(z.title);
      plaque.position.set(cx, z.elevated ? CAT_H + 2.4 : 3.35, cz);
      scene.add(plaque);
    }
  }

  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const ch = cell(c, r);
      if (ch === " " || ch === "#") continue;
      const x = worldX(c), z = worldZ(r);
      const zn = zoneAt(c, r);
      let y0 = 0;
      if (ch === ",") y0 = -2.2;
      if (ch === "c" || (zn && zn.elevated)) y0 = CAT_H;
      const outdoor = !!(zn && zn.outdoor);
      const theme = zn ? zn.theme : "";
      const fl = new THREE.Mesh(
        new THREE.BoxGeometry(TILE, 0.22, TILE),
        outdoor ? mDirt : (ch === "c" || theme === "catwalk" ? mMetal : (theme === "fire" ? mMonkFloor : (theme === "exit" ? mExitFloor : (theme === "hall" || theme === "lobby" ? mHallFloor : (theme === "silver" || theme === "ante" ? mShareFloor : mFloor)))))
      );
      fl.position.set(x, y0 - 0.11, z);
      scene.add(fl);
      if (!outdoor && ch !== "^") {
        const ceilMat = theme === "fire" ? mMonkCeil : (theme === "exit" ? mExitCeil : (theme === "hall" || theme === "lobby" ? mHallCeil : mCeil));
        const ceil = new THREE.Mesh(new THREE.BoxGeometry(TILE, 0.2, TILE), ceilMat);
        ceil.position.set(x, theme === "hall" ? 3.58 : WALL_H + 0.18, z);
        scene.add(ceil);
      }
    }
  }

  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      if (cell(c, r) !== "#") continue;
      const x = worldX(c), z = worldZ(r);
      const nb = zoneAt(c, r + 1) || zoneAt(c, r - 1) || zoneAt(c + 1, r) || zoneAt(c - 1, r);
      const theme = nb ? nb.theme : "";
      const indoorN = nb && !nb.outdoor;
      const sunken = cell(c, r + 1) === "," || cell(c, r - 1) === ",";
      const wallMat = sunken ? mDark : (theme === "exit" ? mExitWall : (theme === "fire" ? mMonkWall : (theme === "hall" || theme === "lobby" ? mHallWall : (indoorN ? mBlock : mStone))));
      boxAt(x, sunken ? -2.2 : 0, z, TILE, sunken ? WALL_H + 2.2 : WALL_H, TILE, wallMat, true);
    }
  }

  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const ch = cell(c, r);
      const x = worldX(c), z = worldZ(r);
      if (ch === "t") {
        boxAt(x, 0, z, 0.85, 5.1, 0.85, mTree, true);
        const leaf = boxAt(x, 4.1, z, 2.3, 1.5, 2.3, new THREE.MeshLambertMaterial({ color: 0x6a9a30, emissive: 0x2a4810, flatShading: true }), false);
        leaf.rotation.y = 0.4;
      }
      if (ch === "F") {
        boxAt(x, 0, z, 0.38, 3.5, 0.38, mFire, true);
        const light = new THREE.PointLight(0xff6622, 2.4, 11, 2);
        light.position.set(x, 2.5, z);
        scene.add(light);
      }
      if (ch === "^") {
        const zn = zoneAt(c, r);
        if (zn && zn.name === "start") continue;
        const py = (zn && zn.elevated) || cell(c, r) === "c" ? CAT_H : 0;
        placePad(x, py, z, !!(zn && zn.outdoor), true);
      }
      if (ch === "1") {
        const n = enemies.length;
        spawnEnemy(x, 0, z, false);
        if (enemies.length > n) {
          const spawned = enemies[enemies.length - 1];
          const zn = zoneAt(c, r);
          if (zn && zn.name === "yard" && !enemies.some((en) => en.opener)) markOpener(spawned);
          if (zn && (zn.theme === "hall" || zn.theme === "lobby")) spawned.hall = true;
          if (zn && zn.theme === "fire") spawned.room = true;
        }
      }
      if (ch === "2") spawnEnemy(x, 0, z, true);
      if (ch === "B") spawnBarrel(x, z);
      if (ch === "G") makeGoldKey(x, 0.85, z);
      if (ch === "L") makeSilverKey(x, 0.9, z);
      if (ch === "M") makePickup(x, 0.6, z, "mp40", new THREE.MeshLambertMaterial({ color: 0x2a2a22, flatShading: true }), "MP40");
      if (ch === "Z") makePickup(x, 0.6, z, "bazooka", new THREE.MeshLambertMaterial({ color: 0x4a3a14, emissive: 0x221100, flatShading: true }), "BAZOOKA");
      if (ch === "R") makePickup(x, 0.6, z, "heat", new THREE.MeshLambertMaterial({ color: 0x8a2010, emissive: 0x401000, flatShading: true }), "HEAT SEEKER");
      if (ch === "U") makePickup(x, 0.6, z, "drunk", new THREE.MeshLambertMaterial({ color: 0x8a6a20, emissive: 0x332200, flatShading: true }), "DRUNK MISSILES");
      if (ch === "H") makeMonkMeal(x, 0.6, z, !!(zoneAt(c, r) && zoneAt(c, r).outdoor));
      if (ch === "I") {
        makeMonkMeal(x, 0.6, z, false);
        const last = pickups[pickups.length - 1];
        if (last) last.label = "1UP";
      }
      if (ch === "A") makePickup(x, 0.6, z, "ammo", new THREE.MeshLambertMaterial({ color: 0xc8a020, flatShading: true }), "AMMO");
      if (ch === "N") makePickup(x, -1.6, z, "drunk", new THREE.MeshLambertMaterial({ color: 0x8a6a20, emissive: 0x332200, flatShading: true }), "DRUNK MISSILES");
      if (ch === "D" || ch === "g" || ch === "l" || ch === "Q") {
        const kind = ch === "g" ? "gold" : ch === "l" ? "silver" : ch === "Q" ? "timed" : "free";
        const doorMat = kind === "gold"
          ? new THREE.MeshBasicMaterial({ color: 0xffc030 })
          : kind === "silver" ? new THREE.MeshBasicMaterial({ color: 0xe8f0ff }) : (kind === "timed" ? new THREE.MeshBasicMaterial({ color: 0xc07020 }) : mMetal);
        const dm = boxAt(x, 0, z, TILE * 0.92, WALL_H - 0.12, kind === "gold" || kind === "silver" ? 0.42 : 0.32, doorMat, true);
        doors.push({ x, z, kind, mesh: dm, open: false, solid: solids[solids.length - 1] });
        if (kind === "timed") timedDoor = doors[doors.length - 1];
        if (kind === "silver") {
          const tag = makeLabel("SILVER");
          tag.position.set(x, 3.15, z);
          scene.add(tag);
          const lit = new THREE.PointLight(0xd0e8ff, 0.8, 11, 1.5);
          lit.position.set(x, 3.1, z);
          scene.add(lit);
        }
        if (kind === "gold") {
          const tag = makeLabel("GOLD");
          tag.position.set(x, 3.15, z);
          scene.add(tag);
          const lit = new THREE.PointLight(0xffc040, 0.85, 14, 1.5);
          lit.position.set(x, 3.2, z);
          scene.add(lit);
        }
      }
      if (ch === "P") {
        const pw = boxAt(x, 0, z, TILE, WALL_H, TILE, mStone, true);
        pushwalls.push({ x, z, mesh: pw, solid: solids[solids.length - 1], pushed: false, t: 0 });
      }
      if (ch === "Y") {
        const plat = boxAt(x, 0, z, TILE * 0.95, 0.22, TILE * 0.95, mMetal, true);
        elevators.push({ x, z, mesh: plat, solid: solids[solids.length - 1], phase: 0 });
      }
      if (ch === "X") {
        const gate = new THREE.MeshBasicMaterial({ color: 0x30f060 });
        boxAt(x, 0, z, 3.2, 3.4, 0.46, gate, false);
        boxAt(x - 1.7, 0, z, 0.38, 3.6, 0.7, gate, false);
        boxAt(x + 1.7, 0, z, 0.38, 3.6, 0.7, gate, false);
        boxAt(x, 3.2, z, 3.8, 0.38, 0.7, gate, false);
        exitTrig = { x, z, r: 2.4 };
        const spr = makeLabel("EXIT");
        spr.scale.set(1.8, 1.8, 1);
        spr.position.set(x, 3.55, z + 0.2);
        spr.rotation.y = Math.PI;
        scene.add(spr);
        const banner = makeExitMark();
        banner.position.set(x, 2.55, z - 1.15);
        banner.rotation.y = Math.PI;
        scene.add(banner);
        const pad = new THREE.Mesh(
          new THREE.BoxGeometry(2.6, 0.08, 2.2),
          new THREE.MeshBasicMaterial({ color: 0x1ae050 })
        );
        pad.position.set(x, 0.06, z);
        scene.add(pad);
        const lit = new THREE.PointLight(0x40ff70, 2.2, 16, 1.1);
        lit.position.set(x, 3.0, z + 0.8);
        scene.add(lit);
      }
      if (ch === "*") makePickup(x, 0.6, z, "secret", mExit, "SECRET EXIT");
      if (ch === "T") {
        const tp = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.06, 1.35), new THREE.MeshLambertMaterial({ color: 0x8a6a28, emissive: 0x332200, flatShading: true }));
        tp.position.set(x, 0.04, z);
        scene.add(tp);
      }
    }
  }

  for (const [c, r] of [[26, 14], [32, 14], [26, 18], [32, 18], [30, 8], [36, 16]]) {
    if (isWall(cell(c, r))) continue;
    const x = worldX(c), z = worldZ(r);
    const b = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.1), mBanner);
    b.position.set(x, 2.4, z);
    scene.add(b);
  }

  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      const zn = zoneAt(c, r);
      if (cell(c, r) !== "c" && !(zn && zn.elevated)) continue;
      addSolid(worldX(c), CAT_H - 0.2, worldZ(r), TILE, 0.25, TILE, null);
    }
  }
}

function lockEl() {
  return (renderer && renderer.domElement) || document.body;
}

function isLocked() {
  const el = document.pointerLockElement || document.mozPointerLockElement;
  return !!el;
}

function lockPointer() {
  if (optionsOpen) return;
  const now = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
  if (now - lockAskedAt < 500) return;
  lockAskedAt = now;
  wantLock = true;
  const el = lockEl();
  if (!el) return;
  try { el.focus(); } catch (err) {}
  const req = el.requestPointerLock || el.mozRequestPointerLock;
  if (!req) return;
  try { req.call(el); } catch (err) {}
}

function isLockHint(t) {
  return t === "CLICK TO LOOK" || t === "LOOK FREE" || t === "LOOK FREE  CLICK TO LOCK";
}

function clearLockHint() {
  if (isLockHint(msg)) {
    msg = "";
    msgT = 0;
  }
}

function hintLockRefused() {
  if (lockHintOnce || !started || optionsOpen) return;
  lockHintOnce = true;
  showMsg("LOOK FREE", 1100);
}

function setKey(e, down) {
  if (!e) return;
  if (e.code) keysDown[e.code] = down;
  const key = (e.key || "").toLowerCase();
  if (e.key === "ArrowUp" || e.code === "ArrowUp") keysDown.ArrowUp = down;
  if (e.key === "ArrowDown" || e.code === "ArrowDown") keysDown.ArrowDown = down;
  if (e.key === "ArrowLeft" || e.code === "ArrowLeft") keysDown.ArrowLeft = down;
  if (e.key === "ArrowRight" || e.code === "ArrowRight") keysDown.ArrowRight = down;
  if (key === "control" || (e.code && e.code.indexOf("Control") === 0)) {
    keysDown.ControlLeft = down;
    keysDown.ControlRight = down;
  }
  if (key === "enter" || e.code === "Enter" || e.code === "NumpadEnter") {
    keysDown.Enter = down;
    keysDown.NumpadEnter = down;
  }
}

function startGame() {
  if (started) return;
  if (!scene) return;
  initAudio();
  if (window.pauseTitleMusic) window.pauseTitleMusic();
  resetPlayer();
  eatClicks = true;
  clickArmed = false;
  mouseDown = false;
  suppressShot = 0.55;
  for (const e of enemies) {
    e.dead = false; e.hp = e.max; e.group.visible = true; e.state = "idle";
    e.nextShot = 2.8 + Math.random();
    if (e.head.material.emissive) e.head.material.emissive.setHex(0x000000);
    else if (e.opener) e.head.material.color.setHex(0xf0d0a0);
  }
  for (const p of pickups) { p.taken = false; p.mesh.visible = true; }
  for (const d of doors) {
    d.open = false;
    if (d.solid) d.solid._open = false;
    d.mesh.position.y = (WALL_H - 0.12) / 2;
  }
  for (const p of pushwalls) {
    p.pushed = false; p.t = 0;
    p.dx = 0; p.dz = 1;
    p.mesh.position.x = p.x;
    p.mesh.position.z = p.z;
    if (p.solid) p.solid._open = false;
  }
  for (const b of barrels) {
    b.dead = false; b.mesh.visible = true;
    if (b.solid) b.solid._open = false;
  }
  for (const r of rockets) scene.remove(r.mesh);
  rockets.length = 0;
  started = true;
  screen = "play";
  document.body.style.cursor = "none";
  if (renderer && renderer.domElement) renderer.domElement.style.cursor = "none";
  ui.style.pointerEvents = "none";
  if (renderer && renderer.domElement) {
    renderer.domElement.tabIndex = 0;
    renderer.domElement.focus();
  }
  const bootSound = () => {
    if (!started) return;
    startAmbience();
    SFX.step("stone", true);
  };
  if (ac && ac.state !== "running" && ac.resume) {
    ac.resume().then(bootSound).catch(bootSound);
  } else {
    bootSound();
  }
  seatOpening();
  lockPointer();
}

function clickOptions(p) {
  const id = hitOpt(p);
  if (!id) return;
  if (id === "slider") {
    slideDrag = true;
    sensFromUiX(p.x);
    return;
  }
  if (id === "mute") { toggleMute(); return; }
  if (id === "reset") {
    binds = defaultBinds();
    saveBinds();
    setSens(1);
    waitingBind = null;
    return;
  }
  if (id === "back") { closeOptions(true); return; }
  if (id === "play") {
    closeOptions(false);
    if (!started) startGame();
    lockPointer();
    return;
  }
  waitingBind = waitingBind === id ? null : id;
}

function bind() {
  if (player) player._k = keysDown;
  const onPlayClick = (e) => {
    initAudio();
    if (e && e.button != null && e.button !== 0 && e.button !== 2) return;
    if (optionsOpen) {
      const p = uiPos(e);
      const id = hitOpt(p);
      if (id) {
        clickOptions(p);
        if (e.preventDefault) e.preventDefault();
        return;
      }
      closeOptions(true);
      if (!started) startGame();
      else lockPointer();
      return;
    }
    if (!started && screen === "title") {
      const p = uiPos(e);
      const hit = titleButtonAt(p);
      if (hit === "controls") {
        openOptions();
        if (e.preventDefault) e.preventDefault();
        return;
      }
      if (hit === "mute") {
        if (musicBlocked && !musicMuted && window.playTitleMusic) window.playTitleMusic();
        else toggleMute();
        if (e.preventDefault) e.preventDefault();
        return;
      }
      if (window.playTitleMusic) window.playTitleMusic();
      startGame();
      return;
    }
    if (!started) startGame();
    else if (screen === "play") lockPointer();
  };
  window.addEventListener("pointerdown", onPlayClick, true);
  const onLockChange = () => {
    pointerLocked = isLocked();
    if (pointerLocked) {
      wantLock = false;
      clearLockHint();
      if (started) {
        document.body.style.cursor = "none";
        if (renderer && renderer.domElement) renderer.domElement.style.cursor = "none";
      }
    }
    if (!pointerLocked && ignoreUnlock) ignoreUnlock = false;
  };
  document.addEventListener("pointerlockchange", onLockChange);
  document.addEventListener("mozpointerlockchange", onLockChange);
  document.addEventListener("pointerlockerror", hintLockRefused);
  document.addEventListener("mozpointerlockerror", hintLockRefused);
  window.addEventListener("mousemove", (e) => {
    if (optionsOpen && slideDrag) {
      sensFromUiX(uiPos(e).x);
      return;
    }
    if (!started || !player || optionsOpen) return;
    if (!pointerLocked && !isLocked()) return;
    player.yaw += e.movementX * 0.00215 * lookSens;
    player.pitch += e.movementY * 0.00215 * lookSens;
    player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch));
  }, true);
  ui.addEventListener("pointerdown", (e) => {
    if (!optionsOpen) return;
    e.preventDefault();
    releaseUiFocus();
  });
  window.addEventListener("pointerup", () => { slideDrag = false; }, true);
  const onKeyDown = (e) => {
    initAudio();
    if (optionsOpen) {
      e.preventDefault();
      if (e.code === "Escape") {
        if (waitingBind) waitingBind = null;
        else closeOptions(false);
        return;
      }
      if (waitingBind) {
        applyBind(waitingBind, e.code);
        waitingBind = null;
        return;
      }
      if (e.code === "ArrowLeft") setSens(lookSens - 0.1);
      if (e.code === "ArrowRight") setSens(lookSens + 0.1);
      if (e.code === "KeyM") toggleMute();
      return;
    }
    if (started && (/^(Arrow|Space|KeyW|KeyA|KeyS|KeyD|Shift|Control|Enter)/.test(e.code || "") || e.key === " " || e.key === "Control" || e.key === "Enter")) {
      e.preventDefault();
    }
    setKey(e, true);
    if (started && !optionsOpen && isFireEvent(e)) {
      e.preventDefault();
      fire();
    }
    if (e.code === "KeyM" && !started) toggleMute();
    if (e.code === "Escape") {
      e.preventDefault();
      if (screen === "title" || started) openOptions();
      return;
    }
    if (!started) return;
    if (codeIs("use", e.code)) use();
    if (codeIs("reload", e.code)) startReload();
    if (codeIs("wep1", e.code) && have[0]) { wepI = 0; swapGun(); }
    if (codeIs("wep2", e.code) && have[1]) { wepI = 1; swapGun(); }
    if (codeIs("wep3", e.code) && have[2]) { wepI = 2; swapGun(); }
    if (codeIs("wep4", e.code) && have[3]) { wepI = 3; swapGun(); }
    if (codeIs("wep5", e.code) && have[4]) { wepI = 4; swapGun(); }
    if (/^(Space|Arrow|KeyW|KeyA|KeyS|KeyD|Shift|Control|Enter)/.test(e.code) || e.key === " ") e.preventDefault();
  };
  window.addEventListener("keydown", onKeyDown, true);
  window.addEventListener("keyup", (e) => {
    if (optionsOpen) return;
    setKey(e, false);
  }, true);
  window.addEventListener("mousedown", (e) => {
    initAudio();
    if (!started || optionsOpen || eatClicks || !clickArmed || suppressShot > 0) return;
    if (e.button !== 0 && e.button !== 2) return;
    if (!isLocked()) lockPointer();
    mouseDown = true;
    fire();
  }, true);
  window.addEventListener("mouseup", () => {
    mouseDown = false;
    eatClicks = false;
    clickArmed = true;
  }, true);
  window.addEventListener("contextmenu", (e) => {
    if (started && !optionsOpen) e.preventDefault();
  }, true);
  window.addEventListener("wheel", (e) => {
    if (!started || optionsOpen) return;
    const dir = e.deltaY > 0 ? 1 : -1;
    for (let i = 0; i < 5; i++) {
      wepI = (wepI + dir + 5) % 5;
      if (have[wepI]) break;
    }
    swapGun();
  }, { passive: true, capture: true });
}

function tick(dt) {
  titleT += dt;
  if (lightning > 0) lightning -= dt * 3;
  else if (Math.random() < dt * 0.15) lightning = 1;
  if (!started || !player) return;
  if (optionsOpen) {
    updateAmbience(dt, false, false, false);
    return;
  }
  timeAlive += dt;
  if (goldDoorOpen || !inCourtyard(player.x, player.z)) lookFreeze = 0;
  const zn = zoneAtWorld(player.x, player.z);
  if (zn && zn.name !== lastZoneName) {
    lastZoneName = zn.name;
    if (window.console) console.log("[ROTT] ROOM", zn.title, player.x.toFixed(2), player.z.toFixed(2));
  }
  if (scene && scene.fog) {
    const theme = zn ? zn.theme : "";
    if (theme === "fire") {
      scene.fog.near = 6;
      scene.fog.far = 28;
      scene.fog.color.setHex(0x2a0c06);
      scene.background.setHex(0x1a0804);
    } else if (theme === "exit") {
      scene.fog.near = 10;
      scene.fog.far = 55;
      scene.fog.color.setHex(0x1a5030);
      scene.background.setHex(0x143828);
    } else if (theme === "yard" || theme === "start") {
      scene.fog.near = 50;
      scene.fog.far = 200;
      scene.fog.color.setHex(0x1a1830);
      scene.background.setHex(0x0a0818);
    } else if (theme === "silver" || theme === "ante") {
      scene.fog.near = 8;
      scene.fog.far = 36;
      scene.fog.color.setHex(0x141820);
      scene.background.setHex(0x0c1016);
    } else if (zn && !zn.outdoor) {
      scene.fog.near = 8;
      scene.fog.far = 40;
      scene.fog.color.setHex(0x1a120c);
      scene.background.setHex(0x140e0a);
    } else {
      scene.fog.near = 50;
      scene.fog.far = 200;
      scene.fog.color.setHex(0x1a1830);
      scene.background.setHex(0x0a0818);
    }
  }
  if (lookFreeze > 0) lookFreeze -= dt;
  rideLaunchLook();
  if (padAir > 0) padAir -= dt;
  else ridePad = null;
  if (suppressShot > 0) suppressShot -= dt;
  if (invulnT > 0) invulnT -= dt;
  if (msgT > 0) msgT -= dt;
  if (dmgT > 0) dmgT -= dt;
  if (hitCueT > 0) hitCueT -= dt;
  if (hitMarkT > 0) hitMarkT -= dt;
  if (faceHurt > 0) faceHurt -= dt;
  if (landDip > 0) landDip -= dt * 4;

  let ix = 0, iz = 0;
  if (actionHeld("fwd") || held.ArrowUp) iz -= 1;
  if (actionHeld("back") || held.ArrowDown) iz += 1;
  if (actionHeld("left") || held.ArrowLeft) ix -= 1;
  if (actionHeld("right") || held.ArrowRight) ix += 1;
  const running = actionHeld("run");
  const air = padAir > 0 || !player.onGround || player.y > 1.1;
  const sp = (running ? RUN : MOVE) * (air ? 0.85 : 1);
  const len = Math.hypot(ix, iz) || 1;
  applyLook();
  const fwd = camForward();
  const rx = -fwd.z, rz = fwd.x;
  let wishX = ((-iz) * fwd.x + ix * rx) / len;
  let wishZ = ((-iz) * fwd.z + ix * rz) / len;
  if (padBoost > 0) {
    padBoost -= dt;
    wishX += openFwdX * 0.42;
    wishZ += openFwdZ * 0.42;
  }
  const moving = ix || iz || padBoost > 0;
  const airborne = !player.onGround;
  updateAmbience(dt, !!moving, running, airborne);
  if (moving) {
    bob += dt * (running ? 26 : 17);
    if (airborne) {
      airT += dt;
      if (airT >= 0.2) {
        airT = 0;
        SFX.air();
      }
    } else {
      const period = running ? 0.26 : 0.36;
      if (stepT > 10) {
        SFX.step(floorKind(), running);
        stepT = 0;
      } else {
        stepT += dt;
        if (stepT >= period) {
          stepT -= period;
          SFX.step(floorKind(), running);
        }
      }
    }
  } else {
    stepT = 99;
    airT = 0;
  }

  if (actionHeld("jump") && player.onGround) { player.vy = JUMP; player.onGround = false; SFX.jump(); }
  player.vy -= GRAV * dt;
  wasOnGround = player.onGround;
  player.onGround = false;
  tryMove(wishX * sp * dt, player.vy * dt, wishZ * sp * dt);
  const pr = playerRow();
  const pc = Math.round(player.x / TILE + W / 2);
  if (player.y < -1.2 || pr < 1 || pr >= H - 1 || pc < 1 || pc >= W - 1) {
    player.x = lastSafe.x;
    player.y = lastSafe.y;
    player.z = lastSafe.z;
    player.vy = 0;
    player.onGround = true;
    padAir = 0;
  } else if (player.onGround && player.y >= -0.05 && !overlaps(player.x, player.y, player.z)) {
    lastSafe.x = player.x;
    lastSafe.y = player.y;
    lastSafe.z = player.z;
  }
  if (player.onGround && !wasOnGround && player.vy < -6) {
    landDip = 0.18;
    SFX.step(floorKind(), true);
  }

  for (const p of pads) {
    p.cool = Math.max(0, p.cool - dt);
    p.flash = Math.max(0, p.flash - dt * 3);
    if (p.nub.material.emissive) {
      p.nub.material.emissive.setHex(p.flash > 0 ? 0xee8800 : (p.yard ? 0xcc6600 : 0x553300));
    } else {
      p.nub.material.color.setHex(p.flash > 0 ? 0xffee88 : 0xffe060);
    }
    const bobY = Math.sin(titleT * 8 + p.x) * (p.yard ? 0.06 : 0.02);
    p.disk.position.y = (p.yard ? 0.14 : 0.1) + bobY + (p.flash > 0 ? 0.08 : 0);
    if (p.cool > 0 || padAir > 0) continue;
    if (feetOnPad(p)) bounceOff(p);
  }

  for (const p of pickups) {
    if (p.taken) continue;
    p.mesh.rotation.y += dt * 2.5;
    if (p.mesh.position) {
      p.x = p.mesh.position.x;
      p.z = p.mesh.position.z;
    }
    p.mesh.position.y = (p.y || 0.6) + Math.sin(titleT * 4 + p.x) * 0.08;
    const grab = p.kind === "gold" ? 3.4 : (p.kind === "silver" ? 3.2 : (p.kind === "health" ? 2.4 : 1.1));
    const near = Math.hypot(player.x - p.x, player.z - p.z) < grab;
    const low = player.y < 3.6;
    if (near && low) takePickup(p);
  }
  if (player && player.y < 1.2) {
    for (const d of doors) {
      if (d.open) continue;
      if (d.kind === "gold" && !haveGold && !keys.gold) continue;
      if (d.kind === "silver" && !keys.silver) continue;
      if (d.kind === "timed") continue;
      if (Math.hypot(player.x - d.x, player.z - d.z) < 2.4) use();
    }
  }

  for (const d of doors) {
    if (d.open && d.mesh.position.y < WALL_H * 1.55) d.mesh.position.y += dt * 5.2;
  }
  for (const p of pushwalls) {
    if (p.pushed && p.t < 1) {
      p.t = Math.min(1, p.t + dt * 0.7);
      p.mesh.position.x = p.x + p.t * TILE * 2.2 * (p.dx || 0);
      p.mesh.position.z = p.z + p.t * TILE * 2.2 * (p.dz || 1);
    }
  }
  for (const el of elevators) {
    el.phase += dt * 0.35;
    const y = 0.1 + (Math.sin(el.phase) * 0.5 + 0.5) * 5.5;
    el.mesh.position.y = y + 0.11;
    if (el.solid) { el.solid.miny = y; el.solid.maxy = y + 0.3; }
    if (Math.hypot(player.x - el.x, player.z - el.z) < 1.4 && player.y < y + 1.5 && player.y > y - 0.4) {
      player.y = y + 0.25;
      player.vy = 0;
      player.onGround = true;
    }
  }

  if (timedDoor && timeAlive >= 180 && timeAlive <= 300 && !timedDoor.open) {
    timedDoor.open = true;
    if (timedDoor.solid) timedDoor.solid._open = true;
    showMsg("TIMED DOOR OPEN");
    SFX.door();
  }
  if (timedDoor && timeAlive > 300 && timedDoor.open) {
    timedDoor.open = false;
    if (timedDoor.solid) timedDoor.solid._open = false;
    timedDoor.mesh.position.y = (WALL_H - 0.12) / 2;
    showMsg("TIMED DOOR SHUT");
  }

  if (exitTrig && !inCourtyard(player.x, player.z) && Math.hypot(player.x - exitTrig.x, player.z - exitTrig.z) < (exitTrig.r || 2.4)) win(false);
  for (let r = 0; r < H; r++) {
    for (let c = 0; c < W; c++) {
      if (cell(c, r) !== "F") continue;
      if (Math.hypot(player.x - worldX(c), player.z - worldZ(r)) < 1.15) hurtPlayer(2, worldX(c), worldZ(r));
    }
  }

  if (reloading > 0) {
    reloading -= dt;
    if (reloading <= 0) finishReload();
  }
  if (ac && ac.state !== "running") initAudio();
  if (fireHeld()) fire();

  for (const e of enemies) updateEnemy(e, dt);
  updateRockets(dt);

  for (let i = gibs.length - 1; i >= 0; i--) {
    const g = gibs[i];
    if (!g.grounded) {
      g.vy -= GRAV * dt;
      g.mesh.position.x += g.vx * dt;
      g.mesh.position.y += g.vy * dt;
      g.mesh.position.z += g.vz * dt;
      g.mesh.rotation.x += dt * 4;
      g.mesh.rotation.z += dt * 3;
      if (g.mesh.position.y < 0.08) {
        g.mesh.position.y = 0.08;
        g.vx = 0;
        g.vy = 0;
        g.vz = 0;
        g.grounded = true;
        if (g.decal) { addDecal(g.mesh.position.x, 0, g.mesh.position.z); g.life = 0; }
        if (g.nade) { explode(g.mesh.position.x, 0.3, g.mesh.position.z); g.life = 0; }
      }
    }
    g.life -= dt;
    if (g.life <= 0) {
      if (g.nade) explode(g.mesh.position.x, g.mesh.position.y, g.mesh.position.z);
      scene.remove(g.mesh);
      gibs.splice(i, 1);
    }
  }
  for (let i = tracers.length - 1; i >= 0; i--) {
    tracers[i].life -= dt;
    if (tracers[i].life <= 0) {
      scene.remove(tracers[i].mesh);
      tracers.splice(i, 1);
    }
  }

  gunKick *= 0.84;
  viewPunch *= 0.88;
  gunRecoil *= 0.76;
  if (gunFlash && gunRecoil < 0.25) gunFlash.visible = false;
  if (muzzle && muzzle.intensity > 0) {
    muzzle.intensity *= 0.55;
    if (muzzle.intensity < 0.2) { muzzle.intensity = 0; muzzle.visible = false; }
  }
  const airAmt = Math.min(1, Math.max(0, (player.y - 0.8) / 9));
  if (padAir > 0) player.pitch = -1.12;
  camera.fov = FOV + airAmt * 14;
  camera.updateProjectionMatrix();
  camera.position.set(player.x, player.y + PLAYER_H + Math.sin(bob) * 0.22 * (1 - airAmt) - landDip * 0.28, player.z);
  camera.rotation.order = "YXZ";
  camera.rotation.y = -player.yaw + viewPunch * (pistolHand ? -0.09 : 0.09);
  camera.rotation.x = (padAir > 0 ? -1.12 : player.pitch) + gunKick + viewPunch * 0.35 + Math.sin(bob * 2) * (moving && !airAmt ? 0.035 : 0);
  camera.rotation.z = (moving ? -ix * 0.07 : camera.rotation.z * 0.8) + viewPunch * 0.14;
  if (gunRoot) {
    gunRoot.position.y = -0.12 + Math.sin(bob) * 0.02 - gunRecoil * 0.04;
    gunRoot.position.x = 0.05 + Math.cos(bob) * 0.012;
    gunRoot.position.z = 0.14 + gunRecoil * 0.08;
    gunRoot.rotation.x = gunRecoil * 0.18;
    const left = gunRoot.getObjectByName("leftPistol");
    const right = gunRoot.getObjectByName("rightPistol");
    if (left && right) {
      left.position.z = -0.7 + (pistolHand ? gunRecoil * 0.08 : 0);
      right.position.z = -0.72 + (pistolHand ? 0 : gunRecoil * 0.08);
    }
  }
}

function drawUI() {
  if (screen === "title") paintTitle(ug, titleT);
  else if (screen === "dead") paintEnd(ug, "YOU DIED", "CLICK TO RISE AGAIN");
  else if (screen === "win") paintEnd(ug, "LEVEL COMPLETE", "THE HUNT CONTINUES");
  else if (screen === "secret") paintEnd(ug, "SECRET EXIT", "DELUXE PATH");
  else if (screen === "options") {
    if (started) paintHUD(ug);
    else paintTitle(ug, titleT);
    paintOptions(ug);
  }
  else paintHUD(ug);
}

function loop() {
  requestAnimationFrame(loop);
  try {
    const dt = Math.min(0.033, clock.getDelta());
    tick(dt);
    if (started && renderer) {
      renderer.setRenderTarget(rt);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      quadMat.uniforms.tDiffuse.value = rt.texture;
      renderer.render(quadScene, quadCam);
    }
    drawUI();
  } catch (err) {
    if (window.console) console.error(err);
  }
}

function main() {
  if (THREE.ColorManagement) THREE.ColorManagement.enabled = false;
  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: "high-performance" });
  renderer.setSize(VW, VH, false);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace || THREE.NoColorSpace || THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.domElement.id = "view";
  renderer.domElement.tabIndex = 0;
  renderer.domElement.style.imageRendering = "pixelated";
  document.body.insertBefore(renderer.domElement, ui);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, VW / VH, 0.08, 340);
  camera.rotation.order = "YXZ";
  scene.add(camera);
  clock = new THREE.Clock();
  rt = new THREE.WebGLRenderTarget(VW, VH, {
    magFilter: THREE.NearestFilter,
    minFilter: THREE.NearestFilter,
    generateMipmaps: false
  });
  if (rt.texture) rt.texture.colorSpace = THREE.NoColorSpace || THREE.LinearSRGBColorSpace;
  quadScene = new THREE.Scene();
  quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  quadMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: "varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }",
    fragmentShader: [
      "uniform sampler2D tDiffuse; varying vec2 vUv;",
      "void main(){",
      "  vec4 c = texture2D(tDiffuse, vUv);",
      "  float bayer = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453);",
      "  c.rgb = c.rgb * 1.12;",
      "  c.rgb = floor(c.rgb * 28.0 + bayer * 0.35) / 28.0;",
      "  float scan = 0.97 + 0.03 * step(0.5, fract(gl_FragCoord.y * 0.5));",
      "  c.rgb *= scan;",
      "  gl_FragColor = c;",
      "}"
    ].join("\n")
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat);
  quadScene.add(quad);
  makeTextures();
  buildLevel();
  setupGun();
  resetPlayer();
  camera.position.set(player.x, player.y + PLAYER_H, player.z);
  bind();
  setupTitleMusic();
  addEventListener("resize", () => {});
  loop();
  if (location.search.indexOf("autostart") >= 0) {
    try { startGame(); } catch (err) {}
  }
}

window.addEventListener("load", () => {
  if (typeof THREE === "undefined") {
    ug.fillStyle = "#000";
    ug.fillRect(0, 0, UW, UH);
    drawText(ug, "COULD NOT LOAD THREE.JS", 160, 90, "#e02020", 1, "center");
    return;
  }
  try { main(); }
  catch (err) {
    if (window.console) console.error(err);
    ug.fillStyle = "#000";
    ug.fillRect(0, 0, UW, UH);
    drawText(ug, "BOOT FAILED", 160, 90, "#e02020", 1, "center");
    if (err && err.message) drawText(ug, String(err.message).slice(0, 36), 160, 110, "#c9a66b", 1, "center");
  }
});
})();
</script>
