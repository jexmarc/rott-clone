  };

let binds = defaultBinds();

function saveBinds() {
  try { localStorage.setItem("rott-binds", JSON.stringify(binds)); } catch (err) {}
}

function loadBinds() {
  binds = defaultBinds();
  try {
    const raw = JSON.parse(localStorage.getItem("rott-binds") || "null");
    if (!raw || typeof raw !== "object") return;
    for (const key of Object.keys(binds)) {
      if (!Array.isArray(raw[key])) continue;
      const codes = raw[key].filter((c) => typeof c === "string" && c && c !== "Escape");
      const keep = MOVE_ARROW[key];
      if (keep && codes.indexOf(keep) < 0) codes.push(keep);
      if (codes.length) binds[key] = codes;
    }
    binds.fire = keepFireKeys(binds.fire);
  } catch (err) {}
}

const FIRE_CODES = ["ControlLeft", "ControlRight", "Enter", "NumpadEnter"];

function keepFireKeys(list) {
  const out = Array.isArray(list) ? list.slice() : [];
  for (let i = 0; i < FIRE_CODES.length; i++) {
    if (out.indexOf(FIRE_CODES[i]) < 0) out.push(FIRE_CODES[i]);
  }
  return out;
}

function actionHeld(action) {
  if (action === "fire") {
    if (held.ControlLeft || held.ControlRight || held.Enter || held.NumpadEnter) return true;
  }
  const codes = binds[action];
  if (!codes) return false;
  for (let i = 0; i < codes.length; i++) if (held[codes[i]]) return true;
  if (MOVE_ARROW[action] && held[MOVE_ARROW[action]]) return true;
  return false;
}

function codeIs(action, code) {
  if (action === "fire" && FIRE_CODES.indexOf(code) >= 0) return true;
  const codes = binds[action];
  return !!(codes && codes.indexOf(code) >= 0);
}

function isFireEvent(e) {
  if (!e) return false;
  const key = (e.key || "").toLowerCase();
  const code = e.code || "";
  if (key === "control" || key === "enter") return true;
  if (code.indexOf("Control") === 0 || code === "Enter" || code === "NumpadEnter") return true;
  return codeIs("fire", code);
}

function fireHeld() {
  if (!clickArmed || eatClicks || suppressShot > 0) return actionHeld("fire");
  return mouseDown || actionHeld("fire");
}

function zoneAt(c, r) {
  for (let i = 0; i < ZONES.length; i++) {
    const z = ZONES[i];
    if (c >= z.c0 && c <= z.c1 && r >= z.r0 && r <= z.r1) return z;
  }
  return null;
}

function zoneAtWorld(x, z) {
  return zoneAt(Math.round(x / TILE + W / 2), Math.round(z / TILE + 2));
}

function hash(x, y) {
  let n = (x * 374761393 + y * 668265263) | 0;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967296;
}

function texNoise(size, fn) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = (y * size + x) * 4;
    const col = fn(x, y, size);
    img.data[i] = col[0] | 0;
    img.data[i + 1] = col[1] | 0;
    img.data[i + 2] = col[2] | 0;
    img.data[i + 3] = col[3] == null ? 255 : col[3];
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.colorSpace = THREE.NoColorSpace;
  return t;
}

function makeTextures() {
  stoneTex = texNoise(64, (x, y) => {
    const row = y >> 3;
    const shift = (row & 1) ? 8 : 0;
    const bx = (x + shift) & 15;
    const by = y & 7;
    const mortar = bx === 0 || by === 0 || bx === 15;
    const n = (hash(x, y) * 28) | 0;
    const stain = hash(x >> 2, y >> 2) > 0.82 ? 18 : 0;
    if (mortar) return [38, 24, 14];
    const dado = y > 42;
    const base = dado ? 108 : 142;
    return [base + n - stain, (base * 0.48 + n * 0.2) | 0, (base * 0.26) | 0];
  });
  blockTex = texNoise(64, (x, y) => {
    const bx = x & 15, by = y & 15;
    const mortar = bx < 2 || by < 2;
    const n = (hash(x, y) * 22) | 0;
    if (mortar) return [48, 28, 16];
    return [168 + n, 88 + n * 0.35, 42 + n * 0.15];
  });
  darkTex = texNoise(64, (x, y) => {
    const row = y >> 4;
    const shift = (row & 1) ? 8 : 0;
    const bx = (x + shift) & 15, by = y & 15;
    const mortar = bx < 2 || by < 2;
    const n = (hash(x, y) * 18) | 0;
    if (mortar) return [22, 16, 12];
    return [58 + n, 40 + n * 0.4, 28];
  });
  floorTex = texNoise(64, (x, y) => {
    const t = (x >> 4) ^ (y >> 4);
    const n = (hash(x, y) * 16) | 0;
    const edge = (x & 15) < 1 || (y & 15) < 1;
    const b = t ? 62 : 52;
    if (edge) return [36, 26, 18];
    return [b + n, 40 + n * 0.4, 26];
  });
  dirtTex = texNoise(64, (x, y) => {
    const tile = (x >> 4) ^ (y >> 4);
    const n = (hash(x, y) * 22) | 0;
    const edge = (x & 15) < 1 || (y & 15) < 1;
    if (edge) return [36, 28, 22];
    const b = tile ? 68 : 54;
    return [b + n, 48 + n * 0.35, 32 + n * 0.2];
  });
  metalTex = texNoise(64, (x, y) => {
    const n = (hash(x, y) * 14) | 0;
    const rivet = (x % 16 < 2 && y % 16 < 2) ? 36 : 0;
    return [48 + n + rivet, 42 + n, 36 + n];
  });
  padTex = texNoise(64, (x, y) => {
    const dx = x - 32, dy = y - 32;
    const r = Math.sqrt(dx * dx + dy * dy);
    const ring = Math.floor(r / 5);
    const groove = Math.abs(r % 5) < 1.1;
    const n = (hash(x, y) * 18) | 0;
    if (r > 30) return [28, 20, 12];
    if (groove) return [48, 32, 14];
    if (ring === 0) return [210 + n, 150 + n * 0.4, 48];
    if (ring === 1) return [168, 108, 36];
    if (ring === 2) return [140 + n, 88, 28];
    if (ring === 3) return [118, 72, 22];
    return [86, 54, 18];
  });
  gadTex = texNoise(64, (x, y) => {
    const dx = x - 32, dy = y - 32;
    const r = Math.sqrt(dx * dx + dy * dy);
    const n = (hash(x, y) * 12) | 0;
    if (r > 30) return [36, 26, 14];
    if (r > 26) return [92, 62, 22];
    if (Math.abs(r - 16) < 1.2 || Math.abs(r - 8) < 1) return [70, 46, 16];
    return [150 + n, 102 + n * 0.3, 36];
  });
  bannerTex = texNoise(64, (x, y) => {
    const tri = Math.abs(x - 32) < (y * 0.42) && y > 14 && y < 54;
    const n = (hash(x, y) * 10) | 0;
    return tri ? [18, 10, 8] : [132 + n, 16, 14];
  });
  crateTex = texNoise(64, (x, y) => {
    const n = (hash(x, y) * 16) | 0;
    const edge = x < 3 || y < 3 || x > 60 || y > 60 || Math.abs(x - 32) < 2;
    return [108 + n - (edge ? 24 : 0), 74 + n * 0.4, 32];
  });
  bloodTex = texNoise(32, (x, y) => {
    const dx = x - 16, dy = y - 16;
    const r = Math.sqrt(dx * dx + dy * dy) + hash(x, y) * 4;
    const a = r < 15 ? 220 : 0;
    return [92 + ((x * y) & 18), 6, 6, a];
  });
  flashTex = texNoise(32, (x, y) => {
    const dx = x - 16, dy = y - 16;
    const r = Math.sqrt(dx * dx + dy * dy);
    if (r < 4) return [255, 255, 210];
    if (r < 9) return [255, 180, 40];
    if (r < 14) return [220, 80, 10, 180];
    return [0, 0, 0, 0];
  });
  hallBrickTex = texNoise(64, (x, y) => {
    const row = y >> 3;
    const shift = (row & 1) ? 10 : 0;
    const bx = (x + shift) & 15;
    const by = y & 7;
    const mortar = bx === 0 || by === 0;
    const n = (hash(x, y) * 20) | 0;
    const soot = hash(x >> 3, y >> 2) > 0.72 ? 24 : 0;
    const wet = hash(x >> 1, y >> 3) > 0.88 ? 10 : 0;
    if (mortar) return [26, 18, 12];
    return [72 + n - soot + wet, 46 + n * 0.3 - soot, 30 - soot * 0.4];
  });
  sootCeilTex = texNoise(64, (x, y) => {
    const n = (hash(x, y) * 16) | 0;
    const blot = hash(x >> 2, y >> 2) > 0.78 ? 18 : 0;
    const beam = (y & 15) < 2 || (x & 31) < 2;
    if (beam) return [32, 22, 14];
    return [40 + n - blot, 30 + n * 0.4 - blot, 22];
  });
  emberFloorTex = texNoise(64, (x, y) => {
    const tile = (x >> 4) ^ (y >> 4);
    const n = (hash(x, y) * 14) | 0;
    const crack = hash(x, y) > 0.93 || ((x + y) & 31) === 0;
    const edge = (x & 15) < 1 || (y & 15) < 1;
    if (crack) return [180, 62, 18];
    if (edge) return [28, 16, 10];
    const b = tile ? 48 : 38;
    return [b + n + 12, 24 + n * 0.3, 16];
  });
  exitStoneTex = texNoise(64, (x, y) => {
    const bx = x & 15, by = y & 15;
    const mortar = bx < 2 || by < 2;
    const n = (hash(x, y) * 16) | 0;
    if (mortar) return [18, 28, 22];
    return [48 + n, 78 + n * 0.45, 58 + n * 0.3];
  });
  skyTex = texNoise(64, (x, y) => {
    const t = y / 64;
    const star = hash(x, y) > 0.968 ? 200 : 0;
    if (t < 0.42) return [6 + star, 8 + star, 22 + star];
    if (t < 0.55) return [18 + star * 0.3, 14, 48];
    const hz = Math.exp(-Math.pow((t - 0.7) * 7.2, 2));
    const band = Math.exp(-Math.pow((t - 0.78) * 10, 2));
    return [
      12 + hz * 210 + band * 80,
      8 + hz * 70 + band * 18,
      28 + hz * 16
    ];
  });
}

function addSolid(x, y, z, w, h, d, mesh) {

function boxAt(x, y, z, w, h, d, material, solid) {

  scene.add(m);
  if (solid !== false) addSolid(x, y, z, w, h, d, m);

function initAudio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac && ac.state !== "running") {

  return ac;
}

function env(type, freq, Q) {
  const f = ac.createBiquadFilter();
  f.type = type;
  f.frequency.value = freq;
  if (Q) f.Q.value = Q;
  return f;
}

function bangBuf(dur) {
  const n = ac.createBuffer(1, Math.max(1, (ac.sampleRate * dur) | 0), ac.sampleRate);
  const d = n.getChannelData(0);
  let brown = 0;
  const click = (ac.sampleRate * 0.003) | 0;
  for (let i = 0; i < d.length; i++) {
    const white = Math.random() * 2 - 1;
    brown = brown * 0.97 + white * 0.03;
    d[i] = (white * 0.52 + brown * 0.48) * (i < click ? 1.85 : 1);
  }
  return n;
}

function gunDest() {
  if (!ac) return null;
  if (gunIn) return gunIn;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 6;
  comp.ratio.value = 5;
  comp.attack.value = 0.001;
  comp.release.value = 0.14;
  const shaper = ac.createWaveShaper();
  const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const x = i / 128 - 1;
    curve[i] = Math.tanh(x * 2.4);
  }
  shaper.curve = curve;
  shaper.oversample = "2x";
  const make = ac.createGain();
  make.gain.value = 3.1;
  comp.connect(shaper);
  shaper.connect(make);
  make.connect(ac.destination);
  gunIn = comp;
  return gunIn;
}

function outNode(dest) {
  return dest || ac.destination;
}

function footDest() {
  if (!ac) initAudio();
  if (!ac) return null;
  if (footIn) return footIn;
  const g = ac.createGain();
  g.gain.value = 4.4;
  g.connect(ac.destination);
  footIn = g;
  return g;
}

function blast(dur, vol, freq, type, Q, dest) {
  initAudio();
  if (!ac) return;
  const s = ac.createBufferSource();
  s.buffer = bangBuf(dur);
  const f = env(type || "lowpass", freq || 1200, Q || 0.85);
  const g = ac.createGain();
  const t = ac.currentTime;
  g.gain.setValueAtTime(Math.max(0.001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(outNode(dest));
  s.start();
}

function kick(freq, dur, vol, dest) {
  initAudio();
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(16, freq * 0.22), t + dur);
  g.gain.setValueAtTime(Math.max(0.001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(outNode(dest));
  o.start(t); o.stop(t + dur + 0.02);
}

function whoosh(dur, vol, startF, endF) {
  if (!ac) return;
  const t = ac.currentTime;
  const s = ac.createBufferSource();
  s.buffer = bangBuf(dur);
  const f = env("bandpass", startF, 1.15);
  f.frequency.setValueAtTime(startF, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(40, endF), t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(Math.max(0.001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(gunDest() || ac.destination);
  s.start();
}

function playNoise(dur, vol, freq, type) {
  blast(dur, vol, freq, type || "lowpass", type === "bandpass" ? 1.4 : 0.85);
}

function playOsc(freq, dur, type, vol, slide) {
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(16, slide), t + dur);
  g.gain.setValueAtTime(Math.max(0.001, vol), t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

function thump(freq, dur, vol) {
  kick(freq, dur, vol);
  kick(freq * 0.5, dur * 1.2, vol * 0.45);
}

function crack(vol) {
  blast(0.018, vol, 2800, "highpass", 0.7);
  blast(0.08, vol * 0.85, 1400, "bandpass", 1.1);
}

function loopNoiseBuf(dur, mode) {
  const n = ac.createBuffer(1, Math.max(1, (ac.sampleRate * dur) | 0), ac.sampleRate);
  const d = n.getChannelData(0);
  let brown = 0, pink = 0;
  for (let i = 0; i < d.length; i++) {
    const white = Math.random() * 2 - 1;
    brown = brown * 0.985 + white * 0.015;
    pink = pink * 0.87 + white * 0.13;
    d[i] = mode === "brown" ? brown * 3.4 : mode === "pink" ? pink * 1.55 : white * 0.65;
  }
  return n;
}

function stopAmbience() {
  for (const n of amb.nodes) {
    try { if (n.stop) n.stop(); } catch (err) {}
    try { if (n.disconnect) n.disconnect(); } catch (err) {}
  }
  amb.nodes = [];
  amb.master = amb.windG = amb.airG = amb.torchG = amb.clothG = amb.droneG = amb.rushG = null;
}

function startAmbience() {
  stopAmbience();
  initAudio();
  if (!ac) return;
  try { if (ac.state === "suspended") ac.resume(); } catch (err) {}
  try {
    const master = ac.createGain();
    master.gain.value = 1.45;
    master.connect(ac.destination);
    amb.master = master;

    function layer(buf, type, freq, Q, gain) {
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      const f = env(type, freq, Q);
      const g = ac.createGain();
      g.gain.value = gain;
      src.connect(f); f.connect(g); g.connect(master);
      src.start();
      amb.nodes.push(src, f, g);
      return g;
    }

    const brown = loopNoiseBuf(5.2, "brown");
    const pink = loopNoiseBuf(4.4, "pink");
    amb.windG = layer(brown, "lowpass", 220, 0.7, 0.42);
    amb.airG = layer(pink, "bandpass", 980, 0.7, 0.22);
    amb.torchG = layer(pink, "bandpass", 1600, 1.2, 0.12);
    amb.clothG = layer(pink, "bandpass", 420, 0.85, 0.1);
    amb.rushG = layer(pink, "highpass", 900, 0.7, 0.001);

    const droneG = ac.createGain();
    droneG.gain.value = 0.1;
    droneG.connect(master);
    amb.droneG = droneG;
    const d1 = ac.createOscillator();
    d1.type = "sine";
    d1.frequency.value = 43;
    const d2 = ac.createOscillator();
    d2.type = "sine";
    d2.frequency.value = 64.4;
    const d3 = ac.createOscillator();
    d3.type = "triangle";
    d3.frequency.value = 86;
    const d3g = ac.createGain();
    d3g.gain.value = 0.35;
    d1.connect(droneG);
    d2.connect(droneG);
    d3.connect(d3g); d3g.connect(droneG);
    d1.start(); d2.start(); d3.start();
    amb.nodes.push(d1, d2, d3, d3g, droneG, master);

    amb.dripT = 0.6;
    amb.crackleT = 0.25;
  } catch (err) {}
}

function playerCell() {
  return {
    c: Math.round(player.x / TILE + W / 2),
    r: Math.round(player.z / TILE + 2)

}

function floorKind() {
  if (!player) return "stone";
  const pos = playerCell();
  const ch = cell(pos.c, pos.r);
  if (ch === "c") return "metal";
  const zn = zoneAt(pos.c, pos.r);
  if (zn && zn.outdoor) return "dirt";
  return "stone";
}

function updateAmbience(dt, moving, running, airborne) {
  if (!started) return;
  if (!ac) initAudio();
  if (!ac) return;
  if (!amb.master) startAmbience();
  if (!amb.master) return;
  const t = ac.currentTime;
  const yard = !!(player && inCourtyard(player.x, player.z));
  if (amb.windG) amb.windG.gain.setTargetAtTime(yard ? 0.55 : 0.28, t, 0.3);
  if (amb.airG) amb.airG.gain.setTargetAtTime(yard ? 0.32 : 0.2, t, 0.3);
  if (amb.torchG) amb.torchG.gain.setTargetAtTime((yard ? 0.12 : 0.2) * (0.7 + Math.random() * 0.5), t, 0.07);
  if (amb.clothG) amb.clothG.gain.setTargetAtTime(airborne ? 0.12 : (moving ? (running ? 0.28 : 0.2) : 0.08), t, 0.1);
  if (amb.rushG) amb.rushG.gain.setTargetAtTime(airborne ? 0.32 : 0.001, t, 0.08);
  if (amb.droneG) amb.droneG.gain.setTargetAtTime(yard ? 0.09 : 0.12, t, 0.4);
  amb.dripT -= dt;
  if (amb.dripT <= 0) {
    amb.dripT = yard ? 1.4 + Math.random() * 1.8 : 0.7 + Math.random() * 1.2;
    SFX.drip();
  }
  amb.crackleT -= dt;
  if (amb.crackleT <= 0) {
    amb.crackleT = 0.18 + Math.random() * 0.45;
    if (!yard || Math.random() < 0.3) SFX.crackle();
  }
}

  if (window.console) console.log("[ROTT] BARK", line);

function drawText(g, str, x, y, color, scale, align) {
  str = String(str).toUpperCase();
  const gw = 6 * scale;
  let px = x;
  if (align === "center") px = x - (str.length * gw) / 2;
  if (align === "right") px = x - str.length * gw;
  g.fillStyle = color;
  for (let i = 0; i < str.length; i++) {
    const gl = FONT[str[i]] || FONT[" "];
    for (let row = 0; row < 7; row++) {
      for (let col = 0; col < 5; col++) {
        if (gl[row][col] === "1") {
          g.fillRect(px + i * gw + col * scale, y + row * scale, scale, scale);
        }
      }
    }
  }
}

  for (let i = 0; i < 42; i++) {

    const sy = (hash(i, 3) * 110) | 0;
    const tw = hash(i, 5) > 0.82 ? 2 : 1;
    g.fillStyle = hash(i, 7) > 0.7 ? "#d0d8ff" : "#8890b0";

  g.fillStyle = "#e8d8a0";
  g.fillRect(268, 18, 18, 18);

function paintHitCue(g) {
  if (hitCueT <= 0) return;
  const a = Math.min(1, hitCueT * 1.4);
  const cx = 160, cy = 84;
  const ox = Math.sin(hitCueAng) * 52;
  const oy = -Math.cos(hitCueAng) * 44;
  g.save();
  g.translate(cx + ox, cy + oy);
  g.rotate(hitCueAng);
  g.fillStyle = "rgba(255,30,20," + (0.45 + a * 0.55) + ")";
  g.beginPath();
  g.moveTo(0, -22);
  g.lineTo(16, 14);
  g.lineTo(0, 5);
  g.lineTo(-16, 14);
  g.closePath();
  g.fill();
  g.restore();
  const side = Math.sin(hitCueAng);
  const fwd = Math.cos(hitCueAng);
  if (side > 0.15) {
    g.fillStyle = "rgba(200,0,0," + (a * 0.55 * side) + ")";
    g.fillRect(250, 0, 70, 168);
  }
  if (side < -0.15) {
    g.fillStyle = "rgba(200,0,0," + (a * 0.55 * -side) + ")";
    g.fillRect(0, 0, 70, 168);
  }
  if (fwd < -0.2) {
    g.fillStyle = "rgba(200,0,0," + (a * 0.45) + ")";
    g.fillRect(0, 140, 320, 28);
  }
  if (fwd > 0.35) {
    g.fillStyle = "rgba(200,0,0," + (a * 0.4) + ")";
    g.fillRect(0, 0, 320, 22);
  }
}

function codeLabel(code) {
  if (!code) return "?";
  if (code.indexOf("Key") === 0) return code.slice(3);
  if (code.indexOf("Digit") === 0) return code.slice(5);
  if (code.indexOf("Arrow") === 0) return code.slice(5).toUpperCase();
  if (code === "Space") return "SPACE";
  if (code.indexOf("Shift") === 0) return "SHIFT";
  if (code.indexOf("Control") === 0) return "CTRL";
  if (code === "Enter" || code === "NumpadEnter") return "ENTER";
  if (code === "AltLeft" || code === "AltRight") return "ALT";
  return String(code).toUpperCase().slice(0, 6);
}

function bindLabel(action) {
  const codes = binds[action] || [];
  const seen = [];
  for (let i = 0; i < codes.length; i++) {
    const lab = codeLabel(codes[i]);
    if (seen.indexOf(lab) < 0) seen.push(lab);
  }
  if (action === "fire") return "CTRL ENTER CLICK";
  return seen.join(" / ") || "?";
}

function addOptHit(id, x, y, w, h) {

function hitOpt(p) {
  for (let i = optHits.length - 1; i >= 0; i--) {
    const h = optHits[i];
    if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) return h.id;
  }
  return null;
}

function toggleMute() {
  musicMuted = !musicMuted;
  try { localStorage.setItem("rott-music-muted", musicMuted ? "1" : "0"); } catch (err) {}
  if (musicMuted) {
    if (window.pauseTitleMusic) window.pauseTitleMusic();
  } else if (!started && window.playTitleMusic) {
    window.playTitleMusic();
  }
}

function applyBind(action, code) {
  if (!action || !code || code === "Escape") return;
  if (code === "F5" || code === "F11" || code === "Tab") return;
  if (!MOVE_ARROW[action] && code.indexOf("Arrow") === 0) return;
  for (const key of Object.keys(binds)) {
    if (key === action) continue;
    if (MOVE_ARROW[key] === code) continue;
    binds[key] = binds[key].filter((c) => c !== code);
  }
  if (MOVE_ARROW[action]) {
    binds[action] = code === MOVE_ARROW[action] ? [code] : [code, MOVE_ARROW[action]];
    if (code !== MOVE_ARROW[action] && binds[action].indexOf(MOVE_ARROW[action]) < 0) {
      binds[action].push(MOVE_ARROW[action]);
    }
  } else if (action === "run" && (code === "ShiftLeft" || code === "ShiftRight")) {
    binds.run = ["ShiftLeft", "ShiftRight"];
  } else if (action === "fire") {
    binds.fire = keepFireKeys([code]);
  } else {
    binds[action] = [code];
  }
  saveBinds();
}

function uiPos(e) {
  const r = ui.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * UW, y: (e.clientY - r.top) / r.height * UH };
}

function titleButtonAt(p) {

  return null;
}

function releaseUiFocus() {
  try { ui.blur(); } catch (err) {}
}

function openOptions() {
  if (optionsOpen) return;
  if (screen === "dead" || screen === "win" || screen === "secret") return;
  optionsReturn = started ? "play" : "title";
  optionsOpen = true;
  screen = "options";
  slideDrag = false;
  waitingBind = null;
  mouseDown = false;
  wantLock = false;
  suppressShot = 0;
  ignoreUnlock = true;
  clearKeys();
  ui.style.pointerEvents = "auto";
  try { document.exitPointerLock(); } catch (err) {}
}

function closeOptions(viaClick) {
  if (!optionsOpen) return;
  optionsOpen = false;
  slideDrag = false;
  waitingBind = null;
  mouseDown = false;
  suppressShot = viaClick ? 1 : 0;
  if (viaClick) clickArmed = false;
  wantLock = false;
  ignoreUnlock = false;
  ui.style.pointerEvents = "none";
  releaseUiFocus();
  screen = started ? "play" : "title";
  if (screen === "play") {
    if (renderer && renderer.domElement) {
      renderer.domElement.tabIndex = 0;
      renderer.domElement.focus();
    }
    if (viaClick) lockPointer();
  }
}

function signpostPad(px, pz) {
  for (let i = 0; i < chevrons.length; i++) scene.remove(chevrons[i]);
  chevrons.length = 0;
  const sx = player ? player.x : worldX(findCell("S").c);
  const sz = player ? player.z : worldZ(findCell("S").r);
  const dx = px - sx, dz = pz - sz;
  const len = Math.hypot(dx, dz) || 1;
  const ux = dx / len, uz = dz / len;
  const yaw = Math.atan2(ux, uz);
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.85);
  shape.lineTo(-0.62, -0.4);
  shape.lineTo(0.62, -0.4);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  const stops = [0.2, 0.4, 0.6, 0.8, 0.95];
  for (let i = 0; i < stops.length; i++) {
    const t = len * stops[i];
    const chev = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xffd040, side: THREE.DoubleSide }));
    chev.position.set(sx + ux * t, 0.14, sz + uz * t);
    chev.rotation.x = -Math.PI / 2;
    chev.rotation.z = -yaw;
    scene.add(chev);
    chevrons.push(chev);
  }
}

function nearestWallHit(x, y, z) {
  let best = null, bestD = 1.6;
  for (const s of solids) {
    if (s._open || !s.mesh) continue;
    const cx = Math.max(s.minx, Math.min(x, s.maxx));
    const cy = Math.max(s.miny, Math.min(y, s.maxy));
    const cz = Math.max(s.minz, Math.min(z, s.maxz));
    const d = Math.hypot(x - cx, y - cy, z - cz);
    if (d < bestD) {
      bestD = d;
      const n = new THREE.Vector3(x - cx, y - cy, z - cz);
      if (n.lengthSq() < 0.0001) n.set(0, 0, 1);
      n.normalize();
      best = { pos: new THREE.Vector3(cx, cy, cz), n };
    }
  }
  return best;
}

function overlaps(nx, ny, nz) {
  const r = PLAYER_R;
  for (const s of solids) {
    if (s._open) continue;
    if (s.maxy - s.miny < 0.38 && ny + 0.22 > s.maxy) continue;
    if (nx + r > s.minx && nx - r < s.maxx &&
        ny + 0.15 < s.maxy && ny + PLAYER_H > s.miny &&
        nz + r > s.minz && nz - r < s.maxz) return s;
  }
  return null;
}

function tryMove(dx, dy, dz) {
  let { x, y, z } = player;
  if (!overlaps(x + dx, y, z)) x += dx;
  else if (!overlaps(x + dx * 0.4, y, z)) x += dx * 0.4;
  if (padAir > 0) {
    y += dy;
    if (dy > 0) player.onGround = false;
  } else if (!overlaps(x, y + dy, z)) y += dy;
  else {
    if (dy < 0) { player.onGround = true; player.vy = 0; }
    else player.vy = 0;
  }
  if (!overlaps(x, y, z + dz)) z += dz;
  else if (!overlaps(x, y, z + dz * 0.4)) z += dz * 0.4;
  let floor = 0;
  const col = Math.round(x / TILE + W / 2);
  const row = Math.round(z / TILE + 2);
  const ch = cell(col, row);
  if (ch === ",") floor = -2.2;
  if (ch === "c" && y >= CAT_H - 0.7) floor = CAT_H;
  if (y < floor && padAir <= 0) { y = floor; player.onGround = true; player.vy = 0; }
  player.x = x; player.y = y; player.z = z;
}

  return p;
}

function setupGun() {
  gunRoot = new THREE.Group();
  gunRoot.scale.set(1.7, 1.7, 1.7);
  gunRoot.position.set(0.05, -0.12, 0.14);
  camera.add(gunRoot);
  muzzle = new THREE.PointLight(0xffaa55, 0, 4);
  muzzle.position.set(0.16, -0.32, -0.62);
  camera.add(muzzle);
  gunLight = new THREE.PointLight(0xffcc88, 0.85, 2.6);
  gunLight.position.set(0.1, -0.2, -0.28);
  camera.add(gunLight);
  gunFlash = new THREE.Mesh(
    new THREE.PlaneGeometry(0.22, 0.22),
    new THREE.MeshBasicMaterial({ map: flashTex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
  );
  gunFlash.position.set(0.16, -0.34, -0.6);

}

function swapGun() {
  while (gunRoot.children.length) gunRoot.remove(gunRoot.children[0]);
  gunRoot.add(buildGun(currentWep().id));
}

function fire() {
  if ((!clickArmed || eatClicks || suppressShot > 0) && !actionHeld("fire")) return;
  const w = currentWep();
  if (reloading > 0) return;
  if (mag[wepI] <= 0) {
    if (w.rocket && reserve[wepI] > 0) {
      const take = Math.min(w.mag, reserve[wepI]);
      mag[wepI] += take;
      reserve[wepI] -= take;
    } else { startReload(); return; }
  }
  const now = performance.now() / 1000;
  if (now - lastShot < 60 / w.rpm) return;
  lastShot = now;
  mag[wepI]--;
  gunKick = w.kick;
  viewPunch = w.kick * 1.6;
  gunRecoil = 1;
  if (w.id === "pistol") pistolHand ^= 1;
  const hx = w.id === "pistol" ? (pistolHand ? -0.12 : 0.12) : 0.14;
  if (muzzle) {
    muzzle.position.set(hx, -0.3, -0.72);
    muzzle.intensity = w.rocket ? 4.2 : 3.4;
    muzzle.visible = true;
  }
  if (gunFlash) {
    gunFlash.position.set(hx, -0.32, -0.7);
    gunFlash.visible = true;
    gunFlash.rotation.z = Math.random() * 6;
  }
  if (w.rocket) {
    if (w.id === "bazooka") SFX.bazooka();
    else if (w.id === "heat") SFX.heat();
    else SFX.drunk();
    launchRockets(w);
  } else {
    if (w.id === "mp40") SFX.mp40(); else SFX.shoot();
    hitscan(w);
  }
  if (mag[wepI] <= 0) startReload();
}

function hitscan(w) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.x += (Math.random() - 0.5) * w.spread;
  dir.y += (Math.random() - 0.5) * w.spread * 0.55;
  dir.z += (Math.random() - 0.5) * w.spread;
  dir.normalize();
  const origin = camera.getWorldPosition(new THREE.Vector3());
  const ray = new THREE.Raycaster(origin, dir, 0, 72);
  let best = null, bestD = 1e9, part = "body";
  for (const e of enemies) {
    if (e.dead) continue;
    const hits = ray.intersectObject(e.group, true);
    if (!hits[0] || hits[0].distance >= bestD) continue;
    best = e;
    bestD = hits[0].distance;
    part = hits[0].point.y > e.y + 1.38 ? "head" : "body";
  }
  for (const b of barrels) {
    if (b.dead) continue;
    const hit = ray.intersectObject(b.mesh, false);
    if (hit[0] && hit[0].distance < bestD) { best = b; bestD = hit[0].distance; part = "barrel"; }
  }
  const end = origin.clone().add(dir.clone().multiplyScalar(best ? bestD : 18));
  const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();
  const hx = w.id === "pistol" ? (pistolHand ? -0.28 : 0.26) : 0.2;
  const muzzlePos = origin.clone()
    .add(dir.clone().multiplyScalar(0.75))
    .add(right.multiplyScalar(hx))
    .add(new THREE.Vector3(0, -0.12, 0));
  addTracer(muzzlePos, end);
  if (!best) {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead) continue;
      const to = new THREE.Vector3(e.x - origin.x, e.y + 1.05 - origin.y, e.z - origin.z);
      const dist = to.length();
      if (dist > 22) continue;
      to.normalize();
      if (to.dot(dir) > (e.opener ? 0.72 : 0.92)) {
        best = e;
        bestD = dist;
        part = origin.y + dir.y * dist > e.y + 1.38 ? "head" : "body";
        break;
      }
    }
  }
  if (!best) {
    const wall = nearestWallHit(end.x, end.y, end.z);
    if (wall) addDecal(end.x, end.y, end.z, wall);
    return;
  }
  if (part === "barrel") { boomBarrel(best); return; }
  const dmg = part === "head" ? w.dmg * HEAD_MULT : w.dmg;
  hurtEnemy(best, dmg, part, origin.clone().add(dir.multiplyScalar(bestD)));
}

function addTracer(a, b) {
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffcc66 }));
  scene.add(line);
  tracers.push({ mesh: line, life: 0.05 });
}

function makeRocketMesh(kind) {
  const g = new THREE.Group();
  const fat = kind === "bazooka";
  const chunky = kind === "drunk" || kind === "heat";
  const br = fat ? 0.32 : chunky ? 0.3 : 0.16;
  const br2 = fat ? 0.36 : chunky ? 0.34 : 0.18;
  const blen = fat ? 1.45 : chunky ? 1.28 : 0.85;
  const bodyCol = kind === "drunk" ? 0xffb030 : kind === "heat" ? 0xff4010 : 0xffd060;
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(br, br2, blen, 8),
    new THREE.MeshBasicMaterial({ color: bodyCol })
  );
  body.rotation.x = Math.PI / 2;
  const nose = new THREE.Mesh(
    new THREE.ConeGeometry(chunky || fat ? 0.36 : 0.18, chunky || fat ? 0.48 : 0.28, 8),
    new THREE.MeshBasicMaterial({ color: kind === "heat" ? 0xff2200 : 0xffee80 })
  );
  nose.rotation.x = Math.PI / 2;
  nose.position.z = fat ? -0.9 : chunky ? -0.82 : -0.52;
  const fin = new THREE.Mesh(new THREE.BoxGeometry(fat || chunky ? 0.72 : 0.38, 0.08, 0.28), new THREE.MeshBasicMaterial({ color: 0x8a5020 }));
  fin.position.z = fat ? 0.48 : chunky ? 0.42 : 0.28;
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(fat || chunky ? 0.28 : 0.14, 6, 6),
    new THREE.MeshBasicMaterial({ color: kind === "drunk" ? 0xff7722 : kind === "heat" ? 0xff2200 : 0xffaa33 })
  );
  glow.position.z = fat ? 0.72 : chunky ? 0.64 : 0.42;
  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(fat || chunky ? 0.26 : 0.12, fat || chunky ? 0.7 : 0.34, 6),
    new THREE.MeshBasicMaterial({ color: kind === "heat" ? 0xff4410 : kind === "drunk" ? 0xff9922 : 0xffcc44 })
  );
  flame.rotation.x = -Math.PI / 2;
  flame.position.z = fat ? 1.05 : chunky ? 0.96 : 0.58;
  const lite = new THREE.PointLight(kind === "heat" ? 0xff3311 : kind === "drunk" ? 0xff8800 : 0xffaa44, fat || chunky ? 2.4 : 1.2, fat || chunky ? 10 : 6, 1.2);
  lite.position.z = fat || chunky ? 0.4 : 0.2;
  g.add(body, nose, fin, glow, flame, lite);
  return g;
}

function spawnRocket(kind, origin, dir, wobble) {
  const speed = kind === "bazooka" ? 10.5 : kind === "heat" ? 8.2 : kind === "drunk" ? 7.4 : 12;
  const mesh = makeRocketMesh(kind);
  mesh.position.copy(origin);
  mesh.lookAt(origin.clone().add(dir));
  scene.add(mesh);
  rockets.push({
    mesh, kind,
    x: origin.x, y: origin.y, z: origin.z,
    vx: dir.x * speed, vy: dir.y * speed, vz: dir.z * speed,
    speed,
    life: kind === "drunk" ? 2.6 : 2.8,
    phase: Math.random() * 6.3,
    wobble: wobble || 0,
    dmg: kind === "bazooka" ? 130 : kind === "heat" ? 90 : 42,
    radius: kind === "bazooka" ? 7.2 : kind === "heat" ? 4.6 : 3.6
  });
}

function launchRockets(w) {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const o = camera.getWorldPosition(new THREE.Vector3()).add(dir.clone().multiplyScalar(1.7));
  if (w.rocket === "drunk") {
    for (let i = 0; i < 5; i++) {
      const d = dir.clone();
      d.x += (Math.random() - 0.5) * 0.48;
      d.y += (Math.random() - 0.5) * 0.2;
      d.z += (Math.random() - 0.5) * 0.48;
      d.normalize();
      spawnRocket("drunk", o.clone(), d, 68 + Math.random() * 28);
    }
  } else {
    spawnRocket(w.rocket, o, dir, 0);
  }
}

function rocketHitSolid(x, y, z) {
  for (const s of solids) {
    if (s._open) continue;
    if (x > s.minx && x < s.maxx && y > s.miny && y < s.maxy && z > s.minz && z < s.maxz) return true;
  }
  return false;
}

function nearestEnemy(x, y, z) {
  let best = null, bestD = 36;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, e.y + 1.1 - y, e.z - z);
    if (d < bestD) { best = e; bestD = d; }
  }
  return best;
}

function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    if (r.kind === "heat") {
      const e = nearestEnemy(r.x, r.y, r.z);
      if (e) {
        const dx = e.x - r.x, dy = e.y + 1.05 - r.y, dz = e.z - r.z;
        const len = Math.hypot(dx, dy, dz) || 1;
        const steer = 32 * dt;
        r.vx += (dx / len) * r.speed * steer;
        r.vy += (dy / len) * r.speed * steer;
        r.vz += (dz / len) * r.speed * steer;
        const sp = Math.hypot(r.vx, r.vy, r.vz) || 1;
        r.vx = r.vx / sp * r.speed;
        r.vy = r.vy / sp * r.speed;
        r.vz = r.vz / sp * r.speed;
      }
    }
    if (r.kind === "drunk") {
      r.phase += dt * 20;
      const wx = Math.sin(r.phase) * 16 + Math.sin(r.phase * 2.2) * 9;
      const wy = Math.cos(r.phase * 0.73) * 6.2;
      const wz = Math.cos(r.phase * 1.37) * 16 + Math.sin(r.phase * 0.55) * 7;
      r.x += (r.vx + wx) * dt;
      r.y += (r.vy + wy) * dt;
      r.z += (r.vz + wz) * dt;
    } else {
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      r.z += r.vz * dt;
    }
    r.life -= dt;
    r.mesh.position.set(r.x, r.y, r.z);
    r.mesh.lookAt(r.x + r.vx, r.y + r.vy, r.z + r.vz);
    if (Math.random() < 0.85) {
      const spark = new THREE.Mesh(
        new THREE.SphereGeometry(r.kind === "bazooka" ? 0.12 : 0.09, 5, 5),
        new THREE.MeshBasicMaterial({ color: r.kind === "heat" ? 0xff2200 : r.kind === "drunk" ? 0xffaa33 : 0xff8822 })
      );
      spark.position.set(r.x, r.y, r.z);
      scene.add(spark);
      gibs.push({ mesh: spark, vx: 0, vy: 0.15, vz: 0, life: 0.22 });
    }
    let hit = r.y < 0.12 || rocketHitSolid(r.x, r.y, r.z) || r.life <= 0;
    let victim = null;
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x - r.x, e.z - r.z) < 0.7 && Math.abs(e.y + 1 - r.y) < 1.1) { hit = true; victim = e; break; }
    }
    for (const b of barrels) {
      if (!b.dead && Math.hypot(b.x - r.x, b.z - r.z) < 0.8) { hit = true; boomBarrel(b); }
    }
    if (hit) {
      explode(r.x, r.y, r.z, r.dmg, r.radius);
      if (victim && !victim.dead) hurtEnemy(victim, r.dmg * 0.35, "body", new THREE.Vector3(r.x, r.y, r.z));
      scene.remove(r.mesh);
      rockets.splice(i, 1);
    }
  }
}

function explode(x, y, z, dmg, radius) {
  SFX.boom();
  const flash = new THREE.PointLight(0xff8833, 5.2, 20, 1.1);
  flash.position.set(x, y + 0.5, z);
  scene.add(flash);
  gibs.push({ mesh: flash, vx: 0, vy: 0, vz: 0, life: 0.22 });
  for (let i = 0; i < 12; i++) {
    const s = 0.4 + Math.random() * 0.85;
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(s, 6, 6),
      new THREE.MeshBasicMaterial({ color: Math.random() > 0.45 ? 0xff6622 : 0xffdd44 })
    );
    ball.position.set(x, y + 0.2, z);
    scene.add(ball);
    gibs.push({
      mesh: ball,
      vx: (Math.random() - 0.5) * 9,
      vy: 2 + Math.random() * 7,
      vz: (Math.random() - 0.5) * 9,
      life: 0.4 + Math.random() * 0.25
    });
  }
  spawnGibs(x, y, z, radius > 6 ? 32 : 22, 0x442200);
  dmg = dmg == null ? 95 : dmg;
  radius = radius == null ? 5.6 : radius;
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, e.z - z);
    if (d < radius) hurtEnemy(e, dmg * (1 - d / radius), "body", new THREE.Vector3(e.x, 1, e.z));
  }
  for (const b of barrels) {
    if (!b.dead && Math.hypot(b.x - x, b.z - z) < radius * 0.75) boomBarrel(b);
  }
  const pd = Math.hypot(player.x - x, player.z - z);
  if (pd < radius * 0.75) hurtPlayer(42 * (1 - pd / (radius * 0.75)), x, z);
}

function boomBarrel(b) {
  if (b.dead) return;
  b.dead = true;
  b.mesh.visible = false;
  if (b.solid) b.solid._open = true;
  explode(b.x, 0.6, b.z);
}

function hurtEnemy(e, dmg, part, hit) {
  e.hp -= dmg;
  e.hurt = 0.28;
  e.flinch = 0.22;
  hitMarkT = 0.22;
  if (e.head.material.emissive) e.head.material.emissive = new THREE.Color(part === "head" ? 0xcc2000 : 0x881000);
  else e.head.material.color.setHex(part === "head" ? 0xff4020 : 0xcc3010);
  blast(0.05, 0.55, 1800, "highpass", 0.8);
  kick(90, 0.08, 0.45);
  playOsc(220, 0.07, "square", 0.16, 80);
  if (e.hp <= 0) {
    killEnemy(e, part === "head" || dmg > 50);
    return;
  }
  addDecal(e.x, e.y + 0.02, e.z, null, e.opener ? 2.2 : 1);
  const wall = nearestWallHit(e.x, 1.2, e.z);
  if (wall) addDecal(e.x, 1.2, e.z, wall, e.opener ? 1.8 : 1);
}

function killEnemy(e, gibby) {
  if (e.dead) return;
  e.dead = true;
  e.state = "dead";
  SFX.death();
  if (gunFlash) gunFlash.visible = false;
  if (muzzle) { muzzle.intensity = 0; muzzle.visible = false; }
  if (e.opener) spawnOpenerGibs(e.x, 1.2, e.z);
  else spawnGibs(e.x, 1.2, e.z);
  killBark(!!e.opener);
  addDecal(e.x, e.y + 0.02, e.z, null, e.opener ? 3.2 : 1);
  const wall = nearestWallHit(e.x, 1.1, e.z);
  if (wall) addDecal(e.x, 1.1, e.z, wall, e.opener ? 2.4 : 1);
  e.group.visible = false;
  if (e.opener) {
    const key = pickups.find((p) => p.kind === "gold" && !p.taken);
    if (key) signpostPad(key.x, key.z);
  }
  if (performance.now() / 1000 > tauntT) {
    showMsg(TAUNTS[(Math.random() * TAUNTS.length) | 0], 800);
    tauntT = performance.now() / 1000 + 2.4;
  }
}

function markHitDir(fromX, fromZ) {
  if (!player || fromX == null || fromZ == null) return;
  const lookX = -Math.sin(player.yaw);
  const lookZ = -Math.cos(player.yaw);
  const hx = fromX - player.x;
  const hz = fromZ - player.z;
  const fwd = hx * lookX + hz * lookZ;
  const right = hx * lookZ - hz * lookX;
  hitCueAng = Math.atan2(right, fwd);
  hitCueT = 0.95;
}

function hurtPlayer(n, fromX, fromZ) {
  if (!player || optionsOpen) return;
  if (invulnT > 0) return;
  if (inCourtyard(player.x, player.z) && timeAlive < 12) return;
  const soak = Math.min(player.armor, n * 0.6);
  player.armor -= soak;
  player.hp = Math.max(0, player.hp - (n - soak));
  invulnT = Math.max(invulnT, 0.42);
  dmgT = 0.38;
  faceHurt = 0.45;
  markHitDir(fromX, fromZ);
  SFX.pain();
  if (window.console) console.log("[ROTT] HP", player.hp | 0);
  if (player.hp <= 0) die();
}

function playerRow() {
  if (!player) return 0;
  return Math.round(player.z / TILE + 2);
}

function die() {
  if (!started || !player) return;
  if (inCourtyard(player.x, player.z) && timeAlive < 20) return;
  pointerLocked = false;
  optionsOpen = false;
  slideDrag = false;
  stopAmbience();
  document.exitPointerLock();
  started = false;
  screen = "dead";
  ui.style.pointerEvents = "none";
  if (window.playTitleMusic) window.playTitleMusic();
}

function win(secret) {
  if (!started || !player) return;
  if (inCourtyard(player.x, player.z)) return;
  pointerLocked = false;
  optionsOpen = false;
  slideDrag = false;
  stopAmbience();
  document.exitPointerLock();
  started = false;
  screen = secret ? "secret" : "win";
  ui.style.pointerEvents = "none";
  if (window.console) console.log("[ROTT] EXIT", player.hp | 0, player.x.toFixed(2), player.z.toFixed(2));
}

function startReload() {
  if (reloading > 0) return;
  const w = currentWep();
  if (w.rocket) return;
  if (mag[wepI] >= w.mag || reserve[wepI] <= 0) return;
  reloading = 0.85;
  SFX.reload();
}

function finishReload() {
  const w = currentWep();
  const need = w.mag - mag[wepI];
  const take = Math.min(need, reserve[wepI]);
  mag[wepI] += take;
  reserve[wepI] -= take;
}

function use() {
  for (const d of doors) {
    if (d.open) continue;
    if (Math.hypot(player.x - d.x, player.z - d.z) < 3.6) {
      if (d.kind === "gold" && !haveGold && !keys.gold) { showMsg("NEED GOLD KEY"); return; }
      if (d.kind === "silver" && !keys.silver) { showMsg("NEED SILVER KEY"); return; }
      if (d.kind === "timed") { showMsg("LOCKED - WAIT 3:00"); return; }
      d.open = true;
      if (d.solid) d.solid._open = true;
      d.mesh.position.y = Math.max(d.mesh.position.y, WALL_H * 0.85);
      SFX.door();
      showMsg(d.kind === "free" ? "DOOR" : d.kind.toUpperCase() + " DOOR");
      if (d.kind === "gold") {
        goldDoorOpen = true;
        lookFreeze = 0;
        padAir = 0;
        invulnT = 1.8;
        if (window.console) console.log("[ROTT] GOLD DOOR", player.x.toFixed(2), player.z.toFixed(2));
        for (const e of enemies) {
          if (e.dead || e.opener || inCourtyard(e.x, e.z)) continue;
          if (Math.hypot(e.x - player.x, e.z - player.z) < 14) {
            e.state = "shoot";
            e.nextShot = e.hall ? 1.25 : 0.9;
          }
        }
      }
      lookFreeze = 0;
      invulnT = Math.max(invulnT, 1.2);
      if (d.hallOut) {
        if (window.console) console.log("[ROTT] ROOM DOOR", player.x.toFixed(2), player.z.toFixed(2));
        for (const e of enemies) {
          if (e.dead || e.opener || inCourtyard(e.x, e.z)) continue;
          if (e.z > d.z && e.z < d.z + 16) {
            e.state = "shoot";
            e.nextShot = 1.35;
          }
        }
      }
      if (d.floorOut) {
        if (window.console) console.log("[ROTT] FLOOR DOOR", player.x.toFixed(2), player.z.toFixed(2));
        for (const e of enemies) {
          if (e.dead || e.opener || inCourtyard(e.x, e.z)) continue;
          if (e.z > d.z && e.z < d.z + 22) {
            e.state = "shoot";
            e.nextShot = 1.45;
          }
        }
      }
      if (d.kind === "silver") {
        showMsg("EXIT");
        if (window.console) console.log("[ROTT] SILVER DOOR", player.x.toFixed(2), player.z.toFixed(2));
        if (exitTrig) signpostPad(exitTrig.x, exitTrig.z);
        for (const e of enemies) {
          if (e.dead || e.opener || e.z <= d.z) continue;
          e.state = "shoot";
          e.nextShot = 1.4;
        }
      }
      return;
    }
  }
  for (const p of pushwalls) {
    if (p.pushed) continue;
    if (Math.hypot(player.x - p.x, player.z - p.z) < 2.7) {
      p.pushed = true;
      p.solid._open = true;
      const ax = player.x - p.x, az = player.z - p.z;
      if (Math.abs(az) >= Math.abs(ax)) {
        p.dx = 0;
        p.dz = az > 0 ? -1 : 1;
      } else {
        p.dx = ax > 0 ? -1 : 1;
        p.dz = 0;
      }
      SFX.door();
      showMsg("PUSHWALL");
      return;
    }
  }
}

function takePickup(p) {
  p.taken = true;
  p.mesh.visible = false;
  SFX.pickup();
  showMsg(p.label, 700);
  if (p.kind === "gold") {
    haveGold = true;
    keys.gold = true;
    if (player) player.gold = true;
    if (window.console) console.log("[ROTT] GOLD KEY", p.x.toFixed(2), p.z.toFixed(2));
    const door = doors.find((d) => d.kind === "gold" && !d.open);
    if (door) signpostPad(door.x, door.z);
  }
  if (p.kind === "silver") {
    keys.silver = true;
    invulnT = Math.max(invulnT, 1.6);
    if (window.console) console.log("[ROTT] SILVER KEY", p.x.toFixed(2), p.z.toFixed(2));
    const door = doors.find((d) => d.kind === "silver" && !d.open);
    if (door) signpostPad(door.x, door.z);
  }
  if (p.kind === "mp40") { have[1] = true; reserve[1] += 64; mag[1] = 32; wepI = 1; swapGun(); }
  if (p.kind === "bazooka") { have[2] = true; reserve[2] += 8; if (mag[2] === 0) mag[2] = 6; wepI = 2; swapGun(); }
  if (p.kind === "heat") { have[3] = true; reserve[3] += 6; if (mag[3] === 0) mag[3] = 5; wepI = 3; swapGun(); }
  if (p.kind === "drunk") { have[4] = true; reserve[4] += 5; if (mag[4] === 0) mag[4] = 4; wepI = 4; swapGun(); }
  if (p.kind === "health") {
    if (p.label === "1UP") {
      player.hp = 100;
      player.armor = Math.max(player.armor, 50);
    } else {
      player.hp = Math.min(100, player.hp + (p.yard ? 40 : 35));
    }
    if (window.console) console.log("[ROTT] MEAL", player.hp | 0, p.label || "");
  }
  if (p.kind === "ammo") reserve[wepI] += weps[wepI].rocket ? 3 : 24;
  if (p.kind === "secret") {
    if (!inCourtyard(player.x, player.z)) win(true);
  }
}

function findCell(ch) {
  for (let r = 0; r < H; r++) {
    const c = MAP[r].indexOf(ch);
    if (c >= 0) return { c, r };
  }
  return { c: 5, r: 3 };
}

function resetPlayer() {
  const s = findCell("S");
  const px = worldX(s.c);
  const pz = worldZ(s.r);
  const spawnZ = zoneAt(s.c, s.r);
  const py = (spawnZ && spawnZ.elevated) || cell(s.c, s.r) === "c" ? CAT_H : 0;
  player = {
    x: px, y: py, z: pz,

    pitch: 0.2,
    vx: 0, vy: 0, vz: 0,
    onGround: true, hp: 100, armor: 0,
    _k: held
  };
  keys.gold = false;
  keys.silver = false;
  haveGold = false;
  goldDoorOpen = false;
  hallEntered = false;
  roomEntered = false;
  floorEntered = false;
  exitWingEntered = false;
  lastZoneName = "";
  ridePad = null;
  wepI = 0;
  mag = [24, 32, 6, 5, 4];
  reserve = [96, 64, 8, 6, 5];
  have = [true, true, true, true, true];
  pistolHand = 0;
  viewPunch = 0;
  gunKick = 0;
  gunRecoil = 0;
  timeAlive = 0;
  padBoost = 0;
  padAir = 0;
  lookFreeze = 0;
  invulnT = 3.2;

}

function applyLook() {
  if (!camera || !player) return;
  camera.position.set(player.x, player.y + PLAYER_H, player.z);
  camera.rotation.order = "YXZ";
  camera.rotation.y = -player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = 0;
  camera.updateMatrixWorld(true);
}

function camForward() {
  const d = new THREE.Vector3(0, 0, -1);
  if (camera) camera.getWorldDirection(d);
  d.y = 0;
  if (d.lengthSq() < 1e-6) d.set(1, 0, 0);
  return d.normalize();
}

function openRay(lx, lz) {
  if (!player) return 0;
  let d = 0;
  for (let i = 1; i <= 28; i++) {
    const x = player.x + lx * i * 1.6;
    const z = player.z + lz * i * 1.6;
    const c = Math.round(x / TILE + W / 2);
    const r = Math.round(z / TILE + 2);
    const ch = cell(c, r);
    if (isWall(ch) || ch === "D" || ch === "g" || ch === "l") return d;
    d = i * 1.6;
  }
  return d;
}

function faceTheYard() {
  if (!player || !camera) return;
  let bestYaw = player.yaw, best = -1;
  for (let i = 0; i < 16; i++) {
    player.yaw = i * Math.PI / 8;
    player.pitch = 0.16;
    applyLook();
    const f = camForward();
    const d = openRay(f.x, f.z);
    if (d > best) {
      best = d;
      bestYaw = player.yaw;
    }
  }
  player.yaw = bestYaw;
  player.pitch = 0.16;
  applyLook();
}

function southFwd() {
  if (!player || !camera) return { x: 0, z: 1, yaw: Math.PI };
  const saveYaw = player.yaw;
  const savePitch = player.pitch;
  let bestYaw = Math.PI, best = -1e9, bestF = { x: 0, z: 1 };
  for (let i = 0; i < 64; i++) {
    player.yaw = (i / 64) * Math.PI * 2;
    player.pitch = 0.1;
    applyLook();
    const f = camForward();
    if (f.z > best) {
      best = f.z;
      bestYaw = player.yaw;
      bestF = { x: f.x, z: f.z };
    }
  }
  player.yaw = saveYaw;
  player.pitch = savePitch;
  applyLook();
  return { x: bestF.x, z: bestF.z, yaw: bestYaw };
}

function aimEastYard() {
  if (!player || !camera) return;
  player.pitch = 0.18;
  let bestYaw = Math.PI / 2, best = -1e9;
  for (let i = 0; i < 64; i++) {
    player.yaw = (i / 64) * Math.PI * 2;
    applyLook();
    const f = camForward();
    const open = openRay(f.x, f.z);
    if (f.x < 0.9 || open < 18) continue;
    const score = f.x * 80 + open;
    if (score > best) {
      best = score;
      bestYaw = player.yaw;
    }
  }
  if (best < 0) {
    best = -1e9;
    for (let i = 0; i < 64; i++) {
      player.yaw = (i / 64) * Math.PI * 2;
      applyLook();
      const f = camForward();
      if (f.x > best) {
        best = f.x;
        bestYaw = player.yaw;
      }
    }
  }
  player.yaw = bestYaw;
  player.pitch = 0.18;
  applyLook();
  const f = camForward();
  openYaw = player.yaw;
  openPitch = 0.18;
  openFwdX = f.x;
  openFwdZ = f.z;
}

function padWorld(p) {
  if (p.group) return { x: p.group.position.x, y: p.group.position.y, z: p.group.position.z };
  return { x: p.x, y: p.y || 0, z: p.z };
}

function padHitR(p) {
  const meshR = p.rad || (p.yard ? 2.2 : 1.12);
  return meshR + PLAYER_R + (p.yard ? 0.28 : 0.2);
}

function feetOnPad(p) {
  if (!player || !p) return false;
  const w = padWorld(p);
  p.x = w.x;
  p.z = w.z;
  const hitR = padHitR(p);
  if (player.y > w.y + 3.4 || player.y < w.y - 0.85) return false;
  return Math.hypot(player.x - w.x, player.z - w.z) < hitR;
}

function rideLaunchLook() {
  if (!player) return;
  if (padAir > 0) player.pitch = -1.12;
}

function bounceOff(p) {
  player.vy = PAD_UP;
  player.onGround = false;
  player.y = Math.max(player.y, p.y || 0) + 2.15;
  ridePad = p;
  padAir = 1.8;
  padBoost = 0;
  player.pitch = -1.12;
  p.cool = 0.7;
  p.flash = 1;
  SFX.pad();
  for (let i = 0; i < 18; i++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.16 + Math.random() * 0.2, 0.06, 0.16),
      new THREE.MeshBasicMaterial({ color: i & 1 ? 0xffe060 : 0xffa020 })
    );
    tossGib(
      m,
      p.x + (Math.random() - 0.5) * 1.2,
      0.35,
      p.z + (Math.random() - 0.5) * 1.2,
      (Math.random() - 0.5) * 5,
      10 + Math.random() * 10,
      (Math.random() - 0.5) * 5,
      0.85
    );
  }
  if (window.console) {
    console.log("[ROTT] BOUNCE vy=" + player.vy.toFixed(1) + " at", player.x.toFixed(2), player.z.toFixed(2), "disk", p.x.toFixed(2), p.z.toFixed(2));
  }
}

function clearLaunchLane(x0, z0, x1, z1) {
  const minx = Math.min(x0, x1) - 1.8, maxx = Math.max(x0, x1) + 1.8;
  const minz = Math.min(z0, z1) - 1.8, maxz = Math.max(z0, z1) + 1.8;
  for (let i = 0; i < solids.length; i++) {
    const s = solids[i];
    const wall = (s.maxy - s.miny) >= WALL_H - 0.3 && (s.maxx - s.minx) >= TILE * 0.85;
    if (wall) continue;
    if (s.maxx > minx && s.minx < maxx && s.maxz > minz && s.minz < maxz) s._open = true;
  }
}

function walkHitsWall(x, z, fx, fz, dist) {
  const steps = Math.max(8, Math.ceil(dist / 0.4));
  for (let i = 1; i <= steps; i++) {
    const t = (i / steps) * dist;
    const px = x + fx * t, pz = z + fz * t;
    const c = Math.round(px / TILE + W / 2);
    const r = Math.round(pz / TILE + 2);
    const ch = cell(c, r);
    if (isWall(ch) || ch === "D" || ch === "g" || ch === "l") return true;
    if (overlaps(px, 0, pz)) return true;
  }
  return false;
}

function proveOpening() {
  const pad = pads.find((p) => p.yard);
  const e = enemies.find((en) => en.opener);
  const f = { x: openFwdX, z: openFwdZ };
  const proof = { lookX: f.x, lookZ: f.z, launched: false, wall: false, openerAlive: !!(e && !e.dead && e.group.visible), padOnRay: false };
  if (pad) {
    const w = padWorld(pad);
    const dx = w.x - player.x, dz = w.z - player.z;
    const dist = Math.hypot(dx, dz) || 1;
    proof.padOnRay = (dx * f.x + dz * f.z) / dist > 0.96;
    proof.pad = { x: w.x, z: w.z, dist: dist };
    const hitR = padHitR(pad);
    let x = player.x, z = player.z;
    for (let i = 0; i < 80; i++) {
      x += f.x * MOVE * 0.016;
      z += f.z * MOVE * 0.016;
      const c = Math.round(x / TILE + W / 2);
      const r = Math.round(z / TILE + 2);
      if (isWall(cell(c, r))) {
        proof.wall = true;
        break;
      }
      if (Math.hypot(x - w.x, z - w.z) < hitR) {
        proof.launched = true;
        proof.walkT = i * 0.016;
        break;
      }
    }
  }
  if (e) proof.opener = { x: e.x, z: e.z, dead: e.dead };
  window.__rottProof = proof;
  if (window.console) console.log("[ROTT] opening", proof);
  return proof;
}

function seatOpening() {
  if (!player || !camera) return;
  player.yaw = Math.PI;
  player.pitch = 0.42;
  applyLook();
  const f = camForward();
  openYaw = player.yaw;
  openPitch = player.pitch;
  openFwdX = f.x;
  openFwdZ = f.z;
  if (window.console) {
    const key = pickups.find((p) => p.kind === "gold" && !p.taken);
    console.log("[ROTT] START", player.x.toFixed(2), player.y.toFixed(2), player.z.toFixed(2));
    if (key) console.log("[ROTT] GOLD KEY AT", key.x.toFixed(2), key.z.toFixed(2));
  }
}

function losBlock(ch) {
  return isWall(ch) || ch === "D" || ch === "g" || ch === "l" || ch === "Q" || ch === "t";
}

function blockedCell(x, z) {
  const c = Math.round(x / TILE + W / 2);
  const r = Math.round(z / TILE + 2);
  return losBlock(cell(c, r));
}

function doorClosedAt(c, r) {
  const wx = worldX(c), wz = worldZ(r);
  for (let i = 0; i < doors.length; i++) {
    const d = doors[i];
    if (Math.abs(d.x - wx) < 0.4 && Math.abs(d.z - wz) < 0.4) return !d.open;
  }
  return true;
}

function pushClosedAt(c, r) {
  const wx = worldX(c), wz = worldZ(r);
  for (let i = 0; i < pushwalls.length; i++) {
    const p = pushwalls[i];
    if (Math.abs(p.x - wx) < 0.4 && Math.abs(p.z - wz) < 0.4) return !p.pushed;
  }
  return true;
}

function blocksSight(x, z) {
  const c = Math.round(x / TILE + W / 2);
  const r = Math.round(z / TILE + 2);
  const ch = cell(c, r);
  if (isWall(ch) || ch === "t") return true;
  if (ch === "D" || ch === "g" || ch === "l" || ch === "Q") return doorClosedAt(c, r);
  if (ch === "P") return pushClosedAt(c, r);
  return false;
}

function hasLOS(e) {
  const dx = player.x - e.x, dz = player.z - e.z;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.5) return true;
  const steps = Math.max(10, Math.ceil(dist / 0.22));
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = e.x + dx * t, z = e.z + dz * t;
    if (blocksSight(x, z)) return false;
    if (blocksSight(x + 0.28, z) || blocksSight(x - 0.28, z) || blocksSight(x, z + 0.28) || blocksSight(x, z - 0.28)) {
      const c = Math.round(x / TILE + W / 2);
      const r = Math.round(z / TILE + 2);
      if (losBlock(cell(c, r))) return false;
    }
  }
  return true;
}

function inCourtyard(x, z) {
  const zn = zoneAtWorld(x, z);
  if (zn && zn.name === "start") return false;
  if (zn && zn.name === "yard") return true;
  const ch = cell(Math.round(x / TILE + W / 2), Math.round(z / TILE + 2));
  return ch === "~" || ch === "t";
}

function playerCanSee(e) {
  const lookX = -Math.sin(player.yaw);
  const lookZ = -Math.cos(player.yaw);
  const hx = e.x - player.x, hz = e.z - player.z;
  const d = Math.hypot(hx, hz) || 1;
  return (hx * lookX + hz * lookZ) / d > 0.2;
}

function updateEnemy(e, dt) {
  if (e.dead) return;
  if (e.hurt > 0) {
    e.hurt -= dt;
    if (e.hurt <= 0) {
      if (e.head.material.emissive) e.head.material.emissive.setHex(0x000000);
      else if (e.opener) e.head.material.color.setHex(0xe8b878);
    }
  }
  if (e.flinch > 0) e.flinch -= dt;
  const dx = player.x - e.x, dz = player.z - e.z;
  const dist = Math.hypot(dx, dz) || 0.001;
  const yard = inCourtyard(player.x, player.z);
  if (yard) {
    if (invulnT > 0 || timeAlive < 3.2) return;
    if (nearSpawn(player.x, player.z) && timeAlive < 6) return;
  }
  const los = dist < 28 && hasLOS(e);
  if (los) e.state = dist < 11 ? "shoot" : "chase";
  else e.state = "idle";
  const sp = (e.tough ? 4.4 : 3.6) * dt;
  function walk(wx, wz) {
    const nx = e.x + wx, nz = e.z + wz;
    if (!blockedCell(nx, e.z)) e.x = nx;
    if (!blockedCell(e.x, nz)) e.z = nz;
  }
  if (e.state === "chase") walk((dx / dist) * sp, (dz / dist) * sp);
  if (e.state === "shoot") {
    walk(-dz / dist * dt * 1.8, dx / dist * dt * 1.8);
    if (dist < 4.2) walk(-(dx / dist) * sp, -(dz / dist) * sp);
    e.nextShot -= dt;
    if (e.nextShot <= 0 && los && dist < 14) {
      if (e.opener && !playerCanSee(e)) {
        e.nextShot = 0.35;
      } else {
        const chip = !!e.opener;
        e.nextShot = e.tough ? 0.55 : (chip ? 2.1 : (e.hall ? 1.65 : (e.room ? 1.85 : 2.05)));
        SFX.enemyShot();
        const origin = new THREE.Vector3(e.x, 1.3, e.z);
        const dest = new THREE.Vector3(player.x, player.y + 1.3, player.z);
        addTracer(origin, dest);
        const acc = e.tough ? 0.7 : (chip ? 0.16 : (e.hall ? 0.3 : (e.room ? 0.22 : 0.18)));
        const dmg = e.tough ? 11 : (chip ? 2 : (e.hall ? 3 : (e.room ? 3 : 2)));
        if (Math.random() < acc) hurtPlayer(dmg, e.x, e.z);
      }
    }
  }
  const kick = e.flinch > 0 ? 0.18 : 0;
  e.group.position.set(e.x + (Math.random() - 0.5) * kick, e.y, e.z + (Math.random() - 0.5) * kick);
  e.group.lookAt(player.x, e.y, player.z);
}

function buildLevel() {
  const mStone = new THREE.MeshLambertMaterial({ map: stoneTex, color: 0xffffff, emissive: 0x140804, flatShading: true });
  const mBlock = mat(blockTex, 0xffffff, 0x100804);
  const mDark = mat(darkTex, 0xffffff);

  const mMonkWall = new THREE.MeshLambertMaterial({ map: darkTex, color: 0xcc8866, emissive: 0x180804, flatShading: true });
  const mFloorCeil = new THREE.MeshLambertMaterial({ map: sootCeilTex, color: 0xffffff, emissive: 0x0a0806, flatShading: true });
  const mShareFloor = new THREE.MeshLambertMaterial({ map: floorTex, color: 0xffffff, emissive: 0x100804, flatShading: true });

  const mSilver = new THREE.MeshLambertMaterial({ color: 0xb8c0c8, emissive: 0x111122, flatShading: true });
  const mFire = new THREE.MeshLambertMaterial({ color: 0xff6622, emissive: 0xaa2200, flatShading: true });
  const mTree = new THREE.MeshLambertMaterial({ color: 0x7aaa38, emissive: 0x3a5810, flatShading: true });

  scene.add(new THREE.AmbientLight(0x3a4468, 0.28));

  const moonLit = new THREE.DirectionalLight(0xc8d4ff, 0.42);
  moonLit.position.set(-20, 80, -30);
  scene.add(moonLit);
  const sun = new THREE.DirectionalLight(0xffc070, 0.58);
  sun.position.set(48, 36, 8);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x6080c0, 0.16);
  fill.position.set(-24, 40, -16);

  const sky = new THREE.Mesh(
